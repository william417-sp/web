<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Process</title>
<meta name="description" content="Tareas, hábitos, metas, notas, entrenos, dinero y estudio en un solo sitio. Sin cuentas y sin nube: todo vive en este navegador.">
<link rel="stylesheet" href="quiet-process.css">
<script>
/* Se marca el tema antes de pintar nada: si esto esperase a los scripts del
   final del body, la página daría un destello blanco en cada carga. */
(function(){var t;try{t=localStorage.getItem("quiet-process.theme");}catch(e){}
if(t!=="light"&&t!=="dark"&&t!=="system")t="dark";
if(t!=="system")document.documentElement.setAttribute("data-theme",t);})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%238a9a8e' stroke-width='8'/></svg>">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Quiet Process</h1>
        <p class="tagline">Todo tu sistema, sin ruido.</p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="themeBtn" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
      <button type="button" id="dataBtn" class="icon-btn" title="Datos y ajustes" aria-label="Datos y ajustes">⋯</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Secciones">
    <button type="button" class="tab is-active" data-view="today"  aria-selected="true">Hoy</button>
    <button type="button" class="tab" data-view="tasks"  aria-selected="false">Tareas</button>
    <button type="button" class="tab" data-view="habits" aria-selected="false">Hábitos</button>
    <button type="button" class="tab" data-view="goals"  aria-selected="false">Metas</button>
    <button type="button" class="tab" data-view="notes"  aria-selected="false">Notas</button>
    <button type="button" class="tab" data-view="train"  aria-selected="false">Entreno</button>
    <button type="button" class="tab" data-view="money"  aria-selected="false">Dinero</button>
    <button type="button" class="tab" data-view="study"  aria-selected="false">Estudio</button>
    <button type="button" class="tab" data-view="review" aria-selected="false">Reflejo</button>
  </nav>
</header>

<main>
  <section class="view is-active" id="view-today"></section>
  <section class="view" id="view-tasks"></section>
  <section class="view" id="view-habits"></section>
  <section class="view" id="view-goals"></section>
  <section class="view" id="view-notes"></section>
  <section class="view" id="view-train"></section>
  <section class="view" id="view-money"></section>
  <section class="view" id="view-study"></section>
  <section class="view" id="view-review"></section>
</main>

<dialog id="dataDialog">
  <div class="dialog-inner">
    <h3>Tus datos</h3>
    <p class="muted small">Todo se guarda solo en este navegador. Nada sale a ningún servidor, así que nada se sincroniza entre dispositivos: exporta una copia de vez en cuando.</p>
    <div id="dataBody"></div>
    <p class="dialog-msg" id="dataMsg" aria-live="polite"></p>
    <form method="dialog" class="dialog-close">
      <button class="btn ghost" value="close">Cerrar</button>
    </form>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <p>Quiet Process · sin cuentas, sin nube, sin rachas que te griten.</p>
</footer>

<script src="qp/core.js"></script>
<script src="qp/tasks.js"></script>
<script src="qp/goals.js"></script>
<script src="qp/notes.js"></script>
<script src="qp/train.js"></script>
<script src="qp/money.js"></script>
<script src="qp/study.js"></script>
<script src="qp/review.js"></script>
<script src="qp/demo.js"></script>
<script src="qp/boot.js"></script>
</body>
</html>
