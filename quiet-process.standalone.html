        var dot = Q.el("span", "hue-dot");
        dot.style.background = h.color || Q.HUES[0];
        li.appendChild(dot);
        var body = Q.el("div", "row-body");
        body.appendChild(Q.el("span", "row-title", h.name));
        var r = rate(h, 30);
        var meta = Q.el("span", "row-meta");
        meta.appendChild(Q.el("span", "chip is-quiet", cadenceLabel(h)));
        meta.appendChild(Q.el("span", "chip is-quiet", r.hit + "/" + r.due + " en 30 días"));
        var n = streak(h);
        if (n) meta.appendChild(Q.el("span", "chip", "▲ " + n));
        if (h.note) meta.appendChild(Q.el("span", "chip is-quiet", h.note));
        body.appendChild(meta);
        li.appendChild(body);

        var acts = Q.el("div", "row-actions");
        acts.appendChild(Q.btn(null, "editar", function () { editingHabit = h; renderHabits(); }));
        acts.appendChild(Q.btn(null, h.archived ? "activar" : "archivar", function () {
          h.archived = !h.archived; Q.save(); renderHabits();
        }));
        acts.appendChild(Q.btn("del", "borrar", function () {
          if (!window.confirm("¿Borrar «" + h.name + "» y sus marcas? No se puede deshacer.")) return;
          Q.db.habits = Q.db.habits.filter(function (x) { return x.id !== h.id; });
          Object.keys(Q.db.log).forEach(function (k) {
            var e = Q.db.log[k];
            if (e.habits && e.habits[h.id]) delete e.habits[h.id];
            pruneEntry(k);
          });
          if (editingHabit === h) editingHabit = null;
          Q.save(); renderHabits();
        }));
        li.appendChild(acts);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    v.appendChild(card);
  }

  function cadenceLabel(h) {
    if (h.cadence === "daily") return "todos los días";
    if (h.cadence === "weekdays") return "de lunes a viernes";
    var d = (h.days || []).slice().sort();
    if (!d.length) return "sin días";
    return d.map(function (i) { return Q.DAY_LONG[i].slice(0, 3); }).join(", ");
  }

  Q.view("today", renderToday);
  Q.view("tasks", renderTasks);
  Q.view("habits", renderHabits);

  QP.tasks = {
    scheduled: scheduled, habitDone: habitDone, habitStart: habitStart,
    streak: streak, rate: rate, activeHabits: activeHabits,
    habitsDueOn: habitsDueOn, entry: entry, pruneEntry: pruneEntry,
    cadenceLabel: cadenceLabel, addTask: addTask, goalOptions: goalOptions,
    subjectOptions: subjectOptions, taskRow: taskRow,
    resetCursor: function () { cursor = Q.today(); }
  };
})();


/* ─── qp/goals.js ─── */
/* Metas: foto, fecha límite y progreso calculado desde lo que ya haces. */
(function () {
  "use strict";
  var Q = QP;
  var editing = null;

  /* El progreso no se teclea a mano: sale de las tareas y hábitos colgados de
     la meta. Si no hay nada colgado, se usa el valor manual. */
  function progress(g) {
    var tasks = Q.db.tasks.filter(function (t) { return t.goalId === g.id; });
    var habits = Q.db.habits.filter(function (h) { return h.goalId === g.id && !h.archived; });
    if (!tasks.length && !habits.length) {
      return { pct: Q.clamp(g.manual || 0, 0, 100), source: "manual", tasks: 0, habits: 0 };
    }
    var doneTasks = tasks.filter(function (t) { return t.done; }).length;
    var parts = [], weights = [];
    if (tasks.length) { parts.push(doneTasks / tasks.length); weights.push(tasks.length); }
    if (habits.length) {
      var avg = Q.sum(habits, function (h) { return QP.tasks.rate(h, 30).pct; }) / habits.length;
      parts.push(avg / 100); weights.push(habits.length);
    }
    var total = Q.sum(weights);
    var pct = Math.round(Q.sum(parts.map(function (p, i) { return p * weights[i]; })) / total * 100);
    return {
      pct: Q.clamp(pct, 0, 100), source: "auto",
      tasks: tasks.length, doneTasks: doneTasks, habits: habits.length
    };
  }

  function daysLeft(g) {
    if (!g.deadline) return null;
    return Math.round((Q.parseKey(g.deadline) - Q.today()) / 86400000);
  }

  /* Las fotos se guardan como data URI dentro del propio almacén. Se reescalan
     antes para no llenar localStorage con un JPEG de 4 MB. */
  function readPhoto(file, cb) {
    if (!/^image\//.test(file.type)) { Q.toast("Eso no es una imagen.", true); return; }
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 640;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function () { Q.toast("No se pudo leer la imagen.", true); };
      img.src = String(r.result);
    };
    r.onerror = function () { Q.toast("No se pudo leer el archivo.", true); };
    r.readAsDataURL(file);
  }

  function form(host) {
    Q.clear(host);
    var g = editing || {};
    var photo = g.photo || null;
    var f = Q.el("form", "stack");

    var title = Q.input("text", { maxlength: 80, placeholder: "Correr 10 km seguidos", required: "required" });
    title.value = g.title || "";
    f.appendChild(Q.field("Meta", title));

    var why = Q.input("textarea", { rows: 2, maxlength: 300, placeholder: "Por qué te importa. Léelo los días flojos." });
    why.value = g.why || "";
    f.appendChild(Q.field("Por qué", why));

    var grid = Q.el("div", "grid-2");
    var deadline = Q.input("date", {});
    deadline.value = g.deadline || "";
    grid.appendChild(Q.field("Fecha límite", deadline));
    var manual = Q.input("number", { min: 0, max: 100, step: 1 });
    manual.value = g.manual == null ? 0 : g.manual;
    grid.appendChild(Q.field("Progreso manual (%)", manual));
    f.appendChild(grid);

    var photoWrap = Q.el("div", "photo-field");
    var preview = Q.el("div", "photo-preview");
    function drawPreview() {
      Q.clear(preview);
      if (photo) {
        var im = new Image();
        im.src = photo;
        im.alt = "";
        preview.appendChild(im);
        preview.appendChild(Q.btn("photo-clear", "quitar", function () {
          photo = null; drawPreview();
        }));
      } else preview.appendChild(Q.el("span", "muted small", "sin foto"));
    }
    drawPreview();
    var file = Q.input("file", { accept: "image/*" });
    Q.on(file, "change", function () {
      if (file.files && file.files[0]) readPhoto(file.files[0], function (d) { photo = d; drawPreview(); });
      file.value = "";
    });
    photoWrap.appendChild(preview);
    photoWrap.appendChild(file);
    f.appendChild(Q.field("Foto", photoWrap));

    var actions = Q.el("div", "form-actions");
    var submit = Q.el("button", "btn primary", editing ? "Guardar" : "Añadir meta");
    submit.type = "submit";
    actions.appendChild(submit);
    if (editing) actions.appendChild(Q.btn("btn ghost", "Cancelar", function () {
      editing = null; render();
    }));
    f.appendChild(actions);

    Q.on(f, "submit", function (ev) {
      ev.preventDefault();
      var v = title.value.trim();
      if (!v) return;
      var data = {
        title: v, why: why.value.trim(), deadline: deadline.value || null,
        manual: Q.clamp(parseInt(manual.value, 10) || 0, 0, 100), photo: photo
      };
      if (editing) Object.assign(editing, data);
      else {
        data.id = Q.uid("g");
        data.archived = false;
        data.createdAt = Q.key(Q.today());
        Q.db.goals.push(data);
      }
      editing = null;
      Q.save(); render();
      Q.toast("Meta guardada.");
    });
    host.appendChild(f);
  }

  function render() {
    var v = Q.$("#view-goals");
    Q.clear(v);

    var fc = Q.el("section", "card");
    var fh = Q.el("div", "card-head");
    fh.appendChild(Q.el("h3", null, editing ? "Editar meta" : "Nueva meta"));
    fc.appendChild(fh);
    var host = Q.el("div");
    fc.appendChild(host);
    form(host);
    v.appendChild(fc);

    var live = Q.db.goals.filter(function (g) { return !g.archived; });
    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, "Tus metas"));
    head.appendChild(Q.el("span", "count", live.length ? live.length + " activas" : ""));
    card.appendChild(head);

    if (!Q.db.goals.length) {
      card.appendChild(Q.el("p", "empty",
        "Sin metas todavía. Una meta es el sitio donde cuelgas tareas y hábitos para ver si de verdad avanzan."));
    } else {
      var grid = Q.el("div", "goal-grid");
      Q.db.goals.forEach(function (g) {
        var p = progress(g);
        var art = Q.el("article", "goal" + (g.archived ? " is-archived" : ""));

        if (g.photo) {
          var im = new Image();
          im.src = g.photo;
          im.alt = "";
          im.className = "goal-photo";
          art.appendChild(im);
        }

        var body = Q.el("div", "goal-body");
        body.appendChild(Q.el("h4", null, g.title));
        if (g.why) body.appendChild(Q.el("p", "goal-why", g.why));

        var ring = Q.el("div", "goal-progress");
        var track = Q.el("div", "goal-track");
        var fill = Q.el("div", "goal-fill");
        fill.style.width = p.pct + "%";
        track.appendChild(fill);
        ring.appendChild(track);
        ring.appendChild(Q.el("strong", null, p.pct + "%"));
        body.appendChild(ring);

        var meta = Q.el("div", "row-meta");
        var dl = daysLeft(g);
        if (dl != null) {
          meta.appendChild(Q.el("span", "chip" + (dl < 0 ? " is-late" : dl <= 14 ? " is-soon" : ""),
            dl < 0 ? "venció hace " + (-dl) + " días" : dl === 0 ? "vence hoy" : "quedan " + dl + " días"));
        }
        if (p.source === "auto") {
          if (p.tasks) meta.appendChild(Q.el("span", "chip is-quiet", p.doneTasks + "/" + p.tasks + " tareas"));
          if (p.habits) meta.appendChild(Q.el("span", "chip is-quiet", p.habits + (p.habits === 1 ? " hábito" : " hábitos")));
        } else {
          meta.appendChild(Q.el("span", "chip is-quiet", "progreso manual"));
        }
        body.appendChild(meta);

        var acts = Q.el("div", "row-actions");
        acts.appendChild(Q.btn(null, "editar", function () { editing = g; render(); window.scrollTo({ top: 0 }); }));
        acts.appendChild(Q.btn(null, g.archived ? "activar" : "archivar", function () {
          g.archived = !g.archived; Q.save(); render();
        }));
        acts.appendChild(Q.btn("del", "borrar", function () {
          if (!window.confirm("¿Borrar la meta «" + g.title + "»? Las tareas y hábitos colgados de ella se quedan, sueltos.")) return;
          Q.db.goals = Q.db.goals.filter(function (x) { return x.id !== g.id; });
          Q.db.tasks.forEach(function (t) { if (t.goalId === g.id) t.goalId = null; });
          Q.db.habits.forEach(function (h) { if (h.goalId === g.id) h.goalId = null; });
          Q.db.notes.forEach(function (n) { if (n.goalId === g.id) n.goalId = null; });
          if (editing === g) editing = null;
          Q.save(); render();
        }));
        body.appendChild(acts);

        art.appendChild(body);
        grid.appendChild(art);
      });
      card.appendChild(grid);
      card.appendChild(Q.el("p", "muted small",
        "El porcentaje sale solo de las tareas y hábitos asignados a la meta. Sin nada asignado, manda el progreso manual."));
    }
    v.appendChild(card);
  }

  Q.view("goals", render);
  QP.goals = { progress: progress, daysLeft: daysLeft };
})();


/* ─── qp/notes.js ─── */
/* Notas enlazadas y grafo interactivo.
   Escribe [[Otra nota]] para enlazar. Las notas también cuelgan de metas y
   asignaturas, y las casillas "- [ ] algo" se convierten en tareas reales. */
(function () {
  "use strict";
  var Q = QP;
  var openId = null;
  var query = "";

  var LINK_RE = /\[\[([^\]\n]{1,80})\]\]/g;

  function linkTargets(note) {
    var out = [], m;
    LINK_RE.lastIndex = 0;
    while ((m = LINK_RE.exec(note.body || "")) !== null) {
      var name = m[1].trim();
      if (name) out.push(name);
    }
    return out;
  }
  function findByTitle(name) {
    var s = Q.slug(name);
    for (var i = 0; i < Q.db.notes.length; i++) {
      if (Q.slug(Q.db.notes[i].title) === s) return Q.db.notes[i];
    }
    return null;
  }
  function backlinks(note) {
    return Q.db.notes.filter(function (n) {
      if (n.id === note.id) return false;
      return linkTargets(n).some(function (t) { return Q.slug(t) === Q.slug(note.title); });
    });
  }

  function newNote(title) {
    var n = {
      id: Q.uid("n"), title: title || "Nota sin título", body: "",
      goalId: null, subjectId: null,
      createdAt: Q.key(Q.today()), updatedAt: Q.key(Q.today())
    };
    Q.db.notes.push(n);
    Q.save();
    return n;
  }

  /* ── casillas dentro de la nota ───────────────────────────────────────── */
  function checkboxLines(note) {
    return (note.body || "").split("\n").map(function (line, i) {
      var m = line.match(/^\s*[-*]\s*\[( |x|X)\]\s*(.+)$/);
      return m ? { i: i, done: m[1].toLowerCase() === "x", text: m[2].trim() } : null;
    }).filter(Boolean);
  }
  function setLine(note, i, done) {
    var lines = note.body.split("\n");
    lines[i] = lines[i].replace(/\[( |x|X)\]/, done ? "[x]" : "[ ]");
    note.body = lines.join("\n");
    note.updatedAt = Q.key(Q.today());
  }
  function promoteToTasks(note) {
    var made = 0;
    checkboxLines(note).forEach(function (c) {
      if (c.done) return;
      var exists = Q.db.tasks.some(function (t) {
        return !t.done && Q.slug(t.title) === Q.slug(c.text);
      });
      if (exists) return;
      QP.tasks.addTask({
        title: c.text, note: "de la nota «" + note.title + "»",
        goalId: note.goalId, subjectId: note.subjectId
      });
      made++;
    });
    Q.toast(made ? made + (made === 1 ? " tarea creada." : " tareas creadas.")
      : "No había casillas sin marcar que no estuvieran ya en tus tareas.");
    Q.refresh();
  }

  /* Renderiza el cuerpo: enlaces clicables, casillas vivas, resto tal cual. */
  function renderBody(note, host) {
    Q.clear(host);
    (note.body || "").split("\n").forEach(function (line, idx) {
      var check = line.match(/^\s*[-*]\s*\[( |x|X)\]\s*(.+)$/);
      if (check) {
        var done = check[1].toLowerCase() === "x";
        var row = Q.el("div", "note-check" + (done ? " is-done" : ""));
        var box = Q.btn("box", null, function () {
          setLine(note, idx, !done);
          Q.save();
          renderBody(note, host);
        });
        box.setAttribute("aria-pressed", String(done));
        row.appendChild(box);
        row.appendChild(inline(check[2]));
        host.appendChild(row);
        return;
      }
      if (!line.trim()) { host.appendChild(Q.el("div", "note-gap")); return; }
      var h = line.match(/^(#{1,3})\s+(.+)$/);
      if (h) {
        host.appendChild(Q.el("h" + (h[1].length + 3), "note-h", h[2]));
        return;
      }
      var p = Q.el("p", "note-p");
      p.appendChild(inline(line));
      host.appendChild(p);
    });
    if (!(note.body || "").trim()) host.appendChild(Q.el("p", "empty", "Nota vacía."));
  }

  function inline(text) {
    var frag = document.createDocumentFragment();
    var last = 0, m;
    LINK_RE.lastIndex = 0;
    while ((m = LINK_RE.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var name = m[1].trim();
      var target = findByTitle(name);
      var a = Q.btn("wikilink" + (target ? "" : " is-missing"), name, function () {
        var t = findByTitle(name) || newNote(name);
        openId = t.id;
        render();
      });
      a.title = target ? "Ir a «" + name + "»" : "Crear «" + name + "»";
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }

  /* ── grafo ────────────────────────────────────────────────────────────────
     Simulación de fuerzas mínima sobre canvas: repulsión entre todos los
     nodos, muelles en las aristas y un tirón suave al centro. */
  function buildGraph() {
    var nodes = [], edges = [], index = {};
    function add(id, label, kind) {
      if (index[id]) return index[id];
      var n = {
        id: id, label: label, kind: kind,
        x: (Math.random() - 0.5) * 200, y: (Math.random() - 0.5) * 200,
        vx: 0, vy: 0, deg: 0
      };
      index[id] = n;
      nodes.push(n);
      return n;
    }
    Q.db.notes.forEach(function (n) { add("n:" + n.id, n.title, "note"); });
    Q.db.goals.filter(function (g) { return !g.archived; })
      .forEach(function (g) { add("g:" + g.id, g.title, "goal"); });
    Q.db.subjects.forEach(function (s) { add("s:" + s.id, s.name, "subject"); });

    function link(a, b) {
      if (!index[a] || !index[b] || a === b) return;
      edges.push({ a: index[a], b: index[b] });
      index[a].deg++; index[b].deg++;
    }
    Q.db.notes.forEach(function (n) {
      linkTargets(n).forEach(function (t) {
        var target = findByTitle(t);
        if (target) link("n:" + n.id, "n:" + target.id);
      });
      if (n.goalId) link("n:" + n.id, "g:" + n.goalId);
      if (n.subjectId) link("n:" + n.id, "s:" + n.subjectId);
    });
    Q.db.tasks.filter(function (t) { return !t.done; }).forEach(function (t) {
      if (!t.goalId && !t.subjectId) return;
      add("t:" + t.id, t.title, "task");
      if (t.goalId) link("t:" + t.id, "g:" + t.goalId);
      if (t.subjectId) link("t:" + t.id, "s:" + t.subjectId);
    });
    Q.db.habits.filter(function (h) { return !h.archived && h.goalId; }).forEach(function (h) {
      add("h:" + h.id, h.name, "habit");
      link("h:" + h.id, "g:" + h.goalId);
    });
    return { nodes: nodes, edges: edges };
  }

  var raf = null;
  function drawGraph(canvas) {
    var g = buildGraph();
    if (raf) cancelAnimationFrame(raf);
    if (!g.nodes.length) return null;

    var ctx = canvas.getContext("2d");
    var hover = null, dragging = null, pan = { x: 0, y: 0 }, zoom = 1;
    var css = getComputedStyle(document.documentElement);
    var ink = css.getPropertyValue("--ink").trim() || "#2c2f2c";
    var faint = css.getPropertyValue("--line").trim() || "#ddd8ce";
    var ground = css.getPropertyValue("--bg").trim() || "#f4f2ed";
    var KIND = {
      note: { c: Q.series(0), r: 6 }, goal: { c: Q.series(1), r: 9 },
      subject: { c: Q.series(2), r: 8 }, task: { c: Q.series(3), r: 5 },
      habit: { c: Q.series(4), r: 5 }
    };

    function size() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: w, h: h };
    }

    var steps = 0;
    function tick() {
      var s = size();
      var cx = s.w / 2 + pan.x, cy = s.h / 2 + pan.y;

      if (steps < 600) {
        steps++;
        for (var i = 0; i < g.nodes.length; i++) {
          var a = g.nodes[i];
          if (a === dragging) continue;
          for (var j = i + 1; j < g.nodes.length; j++) {
            var b = g.nodes[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var d2 = dx * dx + dy * dy || 0.01;
            var d = Math.sqrt(d2);
            var f = 1600 / d2;
            var ux = dx / d, uy = dy / d;
            a.vx -= ux * f; a.vy -= uy * f;
            b.vx += ux * f; b.vy += uy * f;
          }
          a.vx -= a.x * 0.0016;
          a.vy -= a.y * 0.0016;
        }
        g.edges.forEach(function (e) {
          var dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
          var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
          var f = (d - 70) * 0.012;
          var ux = dx / d, uy = dy / d;
          e.a.vx += ux * f; e.a.vy += uy * f;
          e.b.vx -= ux * f; e.b.vy -= uy * f;
        });
        g.nodes.forEach(function (n) {
          if (n === dragging) { n.vx = n.vy = 0; return; }
          n.vx *= 0.86; n.vy *= 0.86;
          n.x += Q.clamp(n.vx, -8, 8);
          n.y += Q.clamp(n.vy, -8, 8);
        });
      }

      ctx.clearRect(0, 0, s.w, s.h);
      ctx.lineWidth = 1;
      ctx.strokeStyle = faint;
      g.edges.forEach(function (e) {
        ctx.globalAlpha = (hover && (hover === e.a || hover === e.b)) ? 0.9 : 0.45;
        ctx.beginPath();
        ctx.moveTo(cx + e.a.x * zoom, cy + e.a.y * zoom);
        ctx.lineTo(cx + e.b.x * zoom, cy + e.b.y * zoom);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;

      ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      g.nodes.forEach(function (n) {
        var k = KIND[n.kind] || KIND.note;
        var r = (k.r + Math.min(4, n.deg)) * zoom;
        var x = cx + n.x * zoom, y = cy + n.y * zoom;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = k.c;
        ctx.fill();
        if (hover === n) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = ink;
          ctx.stroke();
        }
        if (hover === n || n.deg > 1 || g.nodes.length < 18) {
          var label = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
          var ly = y + r + 13;
          // Un fondo detrás del texto: sin él, dos etiquetas que se cruzan se
          // vuelven ilegibles justo donde el grafo está más apretado.
          var w = ctx.measureText(label).width;
          ctx.globalAlpha = hover === n ? 0.95 : 0.8;
          ctx.fillStyle = ground;
          ctx.fillRect(x - w / 2 - 3, ly - 9, w + 6, 13);
          ctx.globalAlpha = hover === n ? 1 : 0.8;
          ctx.fillStyle = ink;
          ctx.fillText(label, x, ly);
          ctx.globalAlpha = 1;
        }
      });
      raf = requestAnimationFrame(tick);
    }

    function at(ev) {
      var r = canvas.getBoundingClientRect();
      var s = { w: canvas.clientWidth, h: canvas.clientHeight };
      var mx = ev.clientX - r.left, my = ev.clientY - r.top;
      var cx = s.w / 2 + pan.x, cy = s.h / 2 + pan.y;
      var best = null, bestD = 22;
      g.nodes.forEach(function (n) {
        var d = Math.hypot(cx + n.x * zoom - mx, cy + n.y * zoom - my);
        if (d < bestD) { bestD = d; best = n; }
      });
      return { node: best, mx: mx, my: my, cx: cx, cy: cy };
    }

    Q.on(canvas, "pointermove", function (ev) {
      var h = at(ev);
      if (dragging) {
        dragging.x = (h.mx - h.cx) / zoom;
        dragging.y = (h.my - h.cy) / zoom;
        steps = Math.min(steps, 560);
        return;
      }
      hover = h.node;
      canvas.style.cursor = hover ? "pointer" : "default";
    });
    Q.on(canvas, "pointerdown", function (ev) {
      var h = at(ev);
      if (h.node) { dragging = h.node; canvas.setPointerCapture(ev.pointerId); }
    });
    Q.on(canvas, "pointerup", function (ev) {
      var h = at(ev);
      if (dragging && h.node === dragging && Math.abs(dragging.vx) < 2) openNode(dragging);
      dragging = null;
    });
    Q.on(canvas, "pointerleave", function () { hover = null; dragging = null; });
    Q.on(canvas, "wheel", function (ev) {
      ev.preventDefault();
      zoom = Q.clamp(zoom * (ev.deltaY < 0 ? 1.1 : 0.9), 0.4, 2.5);
    }, { passive: false });

    tick();
    return function () { if (raf) cancelAnimationFrame(raf); raf = null; };
  }

  function openNode(n) {
    var parts = n.id.split(":");
    if (parts[0] === "n") { openId = parts[1]; render(); }
    else if (parts[0] === "g") Q.show("goals");
    else if (parts[0] === "s") Q.show("study");
    else if (parts[0] === "t") Q.show("tasks");
    else if (parts[0] === "h") Q.show("habits");
  }

  /* ── vista ────────────────────────────────────────────────────────────── */
  var mode = "list";
  var stopGraph = null;

  function render() {
    if (stopGraph) { stopGraph(); stopGraph = null; }
    var v = Q.$("#view-notes");
    Q.clear(v);

    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, "Notas"));
    var seg = Q.el("div", "segmented");
    [["list", "Lista"], ["graph", "Grafo"]].forEach(function (m) {
      var b = Q.btn(mode === m[0] ? "is-on" : "", m[1], function () { mode = m[0]; render(); });
      b.setAttribute("aria-pressed", String(mode === m[0]));
      seg.appendChild(b);
    });
    head.appendChild(seg);
    card.appendChild(head);

    if (mode === "graph") {
      var canvas = Q.el("canvas", "graph");
      canvas.setAttribute("aria-label", "Grafo de notas, metas, asignaturas, tareas y hábitos enlazados");
      card.appendChild(canvas);
      var legend = Q.el("div", "graph-legend");
      [["note", "nota"], ["goal", "meta"], ["subject", "asignatura"],
        ["task", "tarea"], ["habit", "hábito"]].forEach(function (p, i) {
        var item = Q.el("span", "legend-item");
        var dot = Q.el("span", "legend-dot");
        dot.style.background = Q.series(i);
        item.appendChild(dot);
        item.appendChild(document.createTextNode(p[1]));
        legend.appendChild(item);
      });
      card.appendChild(legend);
      card.appendChild(Q.el("p", "muted small",
        "Arrastra los nodos, haz rueda para acercar y clic para abrir. Los enlaces salen de escribir [[Nombre]] en una nota y de asignar metas o asignaturas."));
      v.appendChild(card);
      requestAnimationFrame(function () { stopGraph = drawGraph(canvas); });
      return;
    }

    var tools = Q.el("div", "toolbar");
    var search = Q.input("search", { placeholder: "buscar en notas…" });
    search.value = query;
    Q.on(search, "input", function () {
      query = search.value;
      drawList(listHost);
    });
    tools.appendChild(search);
    tools.appendChild(Q.btn("btn primary", "Nueva nota", function () {
      var n = newNote("Nota del " + Q.shortDate(Q.today()));
      openId = n.id;
      render();
    }));
    card.appendChild(tools);

    var listHost = Q.el("div", "note-split");
    card.appendChild(listHost);
    drawList(listHost);
    v.appendChild(card);
  }

  function drawList(host) {
    Q.clear(host);
    var q = Q.slug(query);
    var notes = Q.db.notes.filter(function (n) {
      if (!q) return true;
      return Q.slug(n.title).indexOf(q) !== -1 || Q.slug(n.body).indexOf(q) !== -1;
    }).sort(function (a, b) { return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1; });

    var side = Q.el("aside", "note-list");
    if (!notes.length) {
      side.appendChild(Q.el("p", "empty", query ? "Nada coincide." : "Sin notas todavía."));
    }
    notes.forEach(function (n) {
      var b = Q.btn("note-item" + (n.id === openId ? " is-on" : ""), null, function () {
        openId = n.id; drawList(host);
      });
      b.appendChild(Q.el("strong", null, n.title));
      var links = linkTargets(n).length;
      var subParts = [n.updatedAt || n.createdAt];
      if (links) subParts.push(links + (links === 1 ? " enlace" : " enlaces"));
      b.appendChild(Q.el("span", null, subParts.join(" · ")));
      side.appendChild(b);
    });
    host.appendChild(side);

    var pane = Q.el("div", "note-pane");
    // Si no hay ninguna elegida, se abre la más reciente en vez de dejar el
    // panel derecho vacío.
    if ((!openId || !Q.byId(Q.db.notes, openId)) && notes.length) openId = notes[0].id;
    var note = openId && Q.byId(Q.db.notes, openId);
    if (!note) {
      pane.appendChild(Q.el("p", "empty",
        "Elige una nota, o crea una nueva. Escribe [[Nombre]] dentro para enlazarla con otra — el grafo se dibuja solo."));
      host.appendChild(pane);
      return;
    }

    var title = Q.input("text", { maxlength: 100 });
    title.className = "note-title";
    title.value = note.title;
    Q.on(title, "input", function () {
      note.title = title.value;
      note.updatedAt = Q.key(Q.today());
      Q.save();
    });
    pane.appendChild(title);

    var meta = Q.el("div", "grid-2");
    var goal = Q.select(QP.tasks.goalOptions(), note.goalId || "");
    Q.on(goal, "change", function () { note.goalId = goal.value || null; Q.save(); });
    meta.appendChild(Q.field("Meta", goal));
    var subj = Q.select(QP.tasks.subjectOptions(), note.subjectId || "");
    Q.on(subj, "change", function () { note.subjectId = subj.value || null; Q.save(); });
    meta.appendChild(Q.field("Asignatura", subj));
    pane.appendChild(meta);

    var body = Q.input("textarea", {
      rows: 12,
      placeholder: "Escribe.\n\n## Un título\n- [ ] una casilla que puede volverse tarea\nEnlaza con [[Otra nota]]."
    });
    body.className = "note-body";
    body.value = note.body;
    var preview = Q.el("div", "note-render");
    var t = null;
    Q.on(body, "input", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        note.body = body.value;
        note.updatedAt = Q.key(Q.today());
        Q.save();
        renderBody(note, preview);
      }, 400);
    });
    pane.appendChild(body);

    var acts = Q.el("div", "form-actions");
    var pending = checkboxLines(note).filter(function (c) { return !c.done; }).length;
    acts.appendChild(Q.btn("btn", "Pasar casillas a tareas" + (pending ? " (" + pending + ")" : ""), function () {
      note.body = body.value;
      promoteToTasks(note);
    }));
    acts.appendChild(Q.btn("btn danger", "Borrar nota", function () {
      if (!window.confirm("¿Borrar «" + note.title + "»?")) return;
      Q.db.notes = Q.db.notes.filter(function (x) { return x.id !== note.id; });
      openId = null;
      Q.save(); drawList(host);
    }));
    pane.appendChild(acts);

    pane.appendChild(Q.el("h4", "note-sub", "Vista"));
    renderBody(note, preview);
    pane.appendChild(preview);

    var back = backlinks(note);
    if (back.length) {
      pane.appendChild(Q.el("h4", "note-sub", "Enlazan aquí"));
      var ul = Q.el("ul", "backlinks");
      back.forEach(function (b) {
        var li = Q.el("li");
        li.appendChild(Q.btn("wikilink", b.title, function () { openId = b.id; drawList(host); }));
        ul.appendChild(li);
      });
      pane.appendChild(ul);
    }
    host.appendChild(pane);
  }

  Q.view("notes", render);
  QP.notes = { linkTargets: linkTargets, findByTitle: findByTitle, buildGraph: buildGraph };
})();


/* ─── qp/train.js ─── */
/* Entrenamientos: series, repeticiones y peso, con récords y evolución. */
(function () {
  "use strict";
  var Q = QP;
  var openWorkout = null;
  var chartExercise = null;

  function exerciseName(id) {
    var e = Q.byId(Q.db.exercises, id);
    return e ? e.name : "(ejercicio borrado)";
  }
  function ensureExercise(name, group) {
    var s = Q.slug(name);
    for (var i = 0; i < Q.db.exercises.length; i++) {
      if (Q.slug(Q.db.exercises[i].name) === s) return Q.db.exercises[i];
    }
    var e = { id: Q.uid("e"), name: name.trim(), group: group || "" };
    Q.db.exercises.push(e);
    return e;
  }

  /* Volumen = suma de reps × peso. Es la medida que más se mueve cuando
     progresas, aunque el peso máximo se quede quieto. */
  function setVolume(s) { return (s.reps || 0) * (s.weight || 0); }
  function workoutVolume(w) { return Q.sum(w.sets || [], setVolume); }

  function allSets(exerciseId) {
    var out = [];
    Q.db.workouts.forEach(function (w) {
      (w.sets || []).forEach(function (s) {
        if (s.exerciseId === exerciseId) out.push({ date: w.date, set: s });
      });
    });
    return out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function records(exerciseId) {
    var sets = allSets(exerciseId);
    if (!sets.length) return null;
    var heaviest = sets[0], mostReps = sets[0], bestVol = sets[0];
    sets.forEach(function (x) {
      if ((x.set.weight || 0) > (heaviest.set.weight || 0)) heaviest = x;
      if ((x.set.reps || 0) > (mostReps.set.reps || 0)) mostReps = x;
      if (setVolume(x.set) > setVolume(bestVol.set)) bestVol = x;
    });
    // 1RM estimado con Epley: peso × (1 + reps/30).
    var best1rm = sets.reduce(function (acc, x) {
      var v = (x.set.weight || 0) * (1 + (x.set.reps || 0) / 30);
      return v > acc.v ? { v: v, x: x } : acc;
    }, { v: 0, x: sets[0] });
    return {
      heaviest: heaviest, mostReps: mostReps, bestVol: bestVol,
      oneRM: Math.round(best1rm.v * 10) / 10, sessions: new Set(sets.map(function (x) { return x.date; })).size
    };
  }

  /* Serie temporal por sesión: volumen total del ejercicio ese día. */
  function progressSeries(exerciseId) {
    var byDate = {};
    allSets(exerciseId).forEach(function (x) {
      byDate[x.date] = (byDate[x.date] || 0) + setVolume(x.set);
    });
    return Object.keys(byDate).sort().map(function (d) {
      return { label: Q.shortDate(Q.parseKey(d)), value: Math.round(byDate[d]), key: d };
    });
  }

  function newWorkout() {
    var w = {
      id: Q.uid("w"), date: Q.key(Q.today()), name: "Entreno", note: "", sets: []
    };
    Q.db.workouts.push(w);
    Q.save();
    return w;
  }

  /* ── editor de un entreno ─────────────────────────────────────────────── */
  function workoutEditor(w, host) {
    Q.clear(host);

    var top = Q.el("div", "grid-2");
    var name = Q.input("text", { maxlength: 60, placeholder: "Empuje, pierna, cinta…" });
    name.value = w.name || "";
    Q.on(name, "input", function () { w.name = name.value; Q.save(); });
    top.appendChild(Q.field("Sesión", name));
    var date = Q.input("date", {});
    date.value = w.date;
    Q.on(date, "change", function () {
      if (date.value) { w.date = date.value; Q.save(); render(); }
    });
    top.appendChild(Q.field("Fecha", date));
    host.appendChild(top);

    var table = Q.el("div", "sets");
    function drawSets() {
      Q.clear(table);
      if (!w.sets.length) {
        table.appendChild(Q.el("p", "empty", "Sin series. Añade la primera abajo."));
      }
      var byEx = Q.groupBy(w.sets, function (s) { return s.exerciseId; });
      Object.keys(byEx).forEach(function (exId) {
        var block = Q.el("div", "set-block");
        var h = Q.el("div", "set-block-head");
        h.appendChild(Q.el("strong", null, exerciseName(exId)));
        var vol = Q.sum(byEx[exId], setVolume);
        h.appendChild(Q.el("span", "count", byEx[exId].length + " series · " + Math.round(vol) + " kg vol."));
        block.appendChild(h);
        var ul = Q.el("ul", "set-list");
        byEx[exId].forEach(function (s, i) {
          var li = Q.el("li");
          li.appendChild(Q.el("span", "set-n", String(i + 1)));
          var reps = Q.input("number", { min: 0, max: 999, step: 1, "aria-label": "Repeticiones" });
          reps.value = s.reps;
          Q.on(reps, "change", function () {
            var v = Math.max(0, parseInt(reps.value, 10) || 0);
            if (v === s.reps) return;
            s.reps = v; Q.save(); drawSets();
          });
          li.appendChild(reps);
          li.appendChild(Q.el("span", "set-x", "×"));
          var wt = Q.input("number", { min: 0, max: 999, step: 0.5, "aria-label": "Peso en kilos" });
          wt.value = s.weight;
          Q.on(wt, "change", function () {
            var v = Math.max(0, parseFloat(wt.value) || 0);
            if (v === s.weight) return;
            s.weight = v; Q.save(); drawSets();
          });
          li.appendChild(wt);
          li.appendChild(Q.el("span", "set-unit", "kg"));
          li.appendChild(Q.btn("del", "×", function () {
            w.sets = w.sets.filter(function (x) { return x.id !== s.id; });
            Q.save(); drawSets();
          }));
          ul.appendChild(li);
        });
        block.appendChild(ul);
        block.appendChild(Q.btn("btn ghost small", "+ otra serie", function () {
          var last = byEx[exId][byEx[exId].length - 1];
          w.sets.push({
            id: Q.uid("s"), exerciseId: exId,
            reps: last ? last.reps : 8, weight: last ? last.weight : 0
          });
          Q.save(); drawSets();
        }));
        table.appendChild(block);
      });
    }
    drawSets();
    host.appendChild(table);

    var add = Q.el("form", "quickadd");
    var exInput = Q.input("text", { placeholder: "Ejercicio (p. ej. Sentadilla)", list: "exerciseList", maxlength: 60 });
    add.appendChild(exInput);
    var addBtn = Q.el("button", "btn", "Añadir ejercicio");
    addBtn.type = "submit";
    add.appendChild(addBtn);
    Q.on(add, "submit", function (ev) {
      ev.preventDefault();
      var n = exInput.value.trim();
      if (!n) return;
      var e = ensureExercise(n);
      w.sets.push({ id: Q.uid("s"), exerciseId: e.id, reps: 8, weight: 0 });
      exInput.value = "";
      Q.save(); drawSets();
    });
    host.appendChild(add);

    var dl = Q.el("datalist");
    dl.id = "exerciseList";
    Q.db.exercises.forEach(function (e) {
      var o = Q.el("option");
      o.value = e.name;
      dl.appendChild(o);
    });
    host.appendChild(dl);

    var note = Q.input("text", { maxlength: 200, placeholder: "cómo fue, molestias, sensaciones…" });
    note.value = w.note || "";
    Q.on(note, "input", function () { w.note = note.value; Q.save(); });
    host.appendChild(Q.field("Nota", note));

    var acts = Q.el("div", "form-actions");
    acts.appendChild(Q.btn("btn primary", "Cerrar sesión", function () {
      openWorkout = null; render();
    }));
    acts.appendChild(Q.btn("btn danger", "Borrar entreno", function () {
      if (!window.confirm("¿Borrar este entreno y sus series?")) return;
      Q.db.workouts = Q.db.workouts.filter(function (x) { return x.id !== w.id; });
      openWorkout = null;
      Q.save(); render();
    }));
    host.appendChild(acts);
  }

  /* ── vista ────────────────────────────────────────────────────────────── */
  function render() {
    var v = Q.$("#view-train");
    Q.clear(v);

    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, openWorkout ? "Entreno abierto" : "Entrenamientos"));
    if (!openWorkout) {
      head.appendChild(Q.btn("btn primary", "Nuevo entreno", function () {
        openWorkout = newWorkout().id;
        render();
      }));
    }
    card.appendChild(head);

    var w = openWorkout && Q.byId(Q.db.workouts, openWorkout);
    if (w) {
      var host = Q.el("div");
      card.appendChild(host);
      workoutEditor(w, host);
      v.appendChild(card);
      return;
    }

    if (!Q.db.workouts.length) {
      card.appendChild(Q.el("p", "empty",
        "Sin entrenos. Crea uno y ve añadiendo ejercicios: rimu-style, series × reps × peso."));
    } else {
      var ul = Q.el("ul", "rows");
      Q.db.workouts.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })
        .forEach(function (wk) {
          var li = Q.el("li", "row");
          var body = Q.el("div", "row-body");
          body.appendChild(Q.el("span", "row-title", wk.name || "Entreno"));
          var meta = Q.el("span", "row-meta");
          meta.appendChild(Q.el("span", "chip is-quiet", Q.longDate(Q.parseKey(wk.date))));
          meta.appendChild(Q.el("span", "chip is-quiet", (wk.sets || []).length + " series"));
          meta.appendChild(Q.el("span", "chip is-quiet", Math.round(workoutVolume(wk)) + " kg de volumen"));
          if (wk.note) meta.appendChild(Q.el("span", "chip is-quiet", wk.note));
          body.appendChild(meta);
          li.appendChild(body);
          var acts = Q.el("div", "row-actions");
          acts.appendChild(Q.btn(null, "abrir", function () { openWorkout = wk.id; render(); }));
          li.appendChild(acts);
          ul.appendChild(li);
        });
      card.appendChild(ul);
    }
    v.appendChild(card);

    if (!Q.db.exercises.length) return;

    // Récords por ejercicio.
    var rec = Q.el("section", "card");
    var rh = Q.el("div", "card-head");
    rh.appendChild(Q.el("h3", null, "Récords"));
    rec.appendChild(rh);
    var trained = Q.db.exercises.filter(function (e) { return allSets(e.id).length; });
    if (!trained.length) {
      rec.appendChild(Q.el("p", "empty", "Registra alguna serie con peso y aquí aparecerán tus marcas."));
    } else {
      var table = Q.el("table", "table");
      var thead = Q.el("thead");
      var trh = Q.el("tr");
      ["Ejercicio", "Más peso", "Más reps", "1RM estimado", "Sesiones"].forEach(function (h) {
        trh.appendChild(Q.el("th", null, h));
      });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tb = Q.el("tbody");
      trained.forEach(function (e) {
        var r = records(e.id);
        var tr = Q.el("tr");
        tr.appendChild(Q.el("td", null, e.name));
        tr.appendChild(Q.el("td", null, r.heaviest.set.weight + " kg × " + r.heaviest.set.reps));
        tr.appendChild(Q.el("td", null, r.mostReps.set.reps + " × " + r.mostReps.set.weight + " kg"));
        tr.appendChild(Q.el("td", null, r.oneRM ? r.oneRM + " kg" : "—"));
        tr.appendChild(Q.el("td", null, String(r.sessions)));
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      var scroller = Q.el("div", "table-wrap");
      scroller.appendChild(table);
      rec.appendChild(scroller);
      rec.appendChild(Q.el("p", "muted small",
        "El 1RM estimado usa la fórmula de Epley (peso × (1 + reps/30)). Es una referencia, no una orden."));
    }
    v.appendChild(rec);

    // Evolución de un ejercicio.
    if (trained.length) {
      var ev = Q.el("section", "card");
      var eh = Q.el("div", "card-head");
      eh.appendChild(Q.el("h3", null, "Evolución"));
      var pick = Q.select(trained.map(function (e) {
        return { value: e.id, label: e.name };
      }), chartExercise || trained[0].id);
      Q.on(pick, "change", function () { chartExercise = pick.value; render(); });
      eh.appendChild(pick);
      ev.appendChild(eh);
      var host2 = Q.el("div", "viz-host");
      ev.appendChild(host2);
      var exId = chartExercise && Q.byId(Q.db.exercises, chartExercise) ? chartExercise : trained[0].id;
      Q.lineChart(host2, progressSeries(exId), {
        title: "Volumen por sesión de " + exerciseName(exId),
        fmt: function (v) { return Math.round(v) + " kg"; },
        // Sin relleno y con el rango ajustado: el área a cero aplastaría la
        // mejora real hasta parecer una recta plana.
        area: false, zero: false,
        emptyText: "Con una sola sesión no hay evolución que dibujar todavía."
      });
      ev.appendChild(Q.el("p", "muted small",
        "Volumen por sesión: repeticiones × peso, sumado. Sube antes que el peso máximo, así que es lo que mejor muestra que estás progresando."));
      v.appendChild(ev);
    }
  }

  Q.view("train", render);
  QP.train = {
    records: records, progressSeries: progressSeries,
    workoutVolume: workoutVolume, allSets: allSets
  };
})();


/* ─── qp/money.js ─── */
/* Dinero: ingresos, gastos, cuotas e importación de extractos.
   Los importes se guardan en céntimos enteros — nunca se suman floats. */
(function () {
  "use strict";
  var Q = QP;
  var month = Q.monthKey(Q.today());
  var editing = null;

  function inMonth(t, mk) { return (t.date || "").slice(0, 7) === mk; }
  function monthsPresent() {
    var set = {};
    Q.db.tx.forEach(function (t) { set[(t.date || "").slice(0, 7)] = true; });
    set[Q.monthKey(Q.today())] = true;
    return Object.keys(set).filter(Boolean).sort();
  }
  function totals(mk) {
    var rows = Q.db.tx.filter(function (t) { return inMonth(t, mk); });
    var inc = Q.sum(rows.filter(function (t) { return t.kind === "in"; }), function (t) { return t.amount; });
    var out = Q.sum(rows.filter(function (t) { return t.kind === "out"; }), function (t) { return t.amount; });
    return { inc: inc, out: out, net: inc - out, rows: rows };
  }

  /* Una compra a plazos se guarda como N movimientos, uno por mes, unidos por
     un id de grupo. Así el mes que lo pagas ves justo lo que te toca. */
  function addTx(f) {
    var parts = Math.max(1, parseInt(f.parts, 10) || 1);
    var group = parts > 1 ? Q.uid("grp") : null;
    var per = Math.round(f.amount / parts);
    var made = [];
    for (var i = 0; i < parts; i++) {
      var d = Q.addMonths(Q.parseKey(f.date), i);
      // El redondeo sobrante se mete en la última cuota: la suma cuadra.
      var amount = i === parts - 1 ? f.amount - per * (parts - 1) : per;
      made.push({
        id: Q.uid("m"), date: Q.key(d), amount: amount, kind: f.kind,
        category: f.category || "Sin categoría", note: f.note || "",
        group: group, part: parts > 1 ? i + 1 : null, parts: parts > 1 ? parts : null
      });
    }
    Q.db.tx = Q.db.tx.concat(made);
    Q.save();
    return made;
  }

  /* Detecta "3/12", "cuota 2 de 6", "(1 de 4)" en el concepto del extracto. */
  function detectInstallment(text) {
    var m = String(text).match(/(?:cuota\s*)?(\d{1,2})\s*(?:\/|\s+de\s+)\s*(\d{1,2})/i);
    if (!m) return null;
    var part = +m[1], parts = +m[2];
    if (part < 1 || parts < 2 || part > parts || parts > 60) return null;
    return { part: part, parts: parts };
  }

  function categoryTotals(mk) {
    var rows = Q.db.tx.filter(function (t) { return inMonth(t, mk) && t.kind === "out"; });
    var by = Q.groupBy(rows, function (t) { return t.category || "Sin categoría"; });
    return Object.keys(by).map(function (c) {
      return { label: c, value: Q.sum(by[c], function (t) { return t.amount; }), n: by[c].length };
    }).sort(function (a, b) { return b.value - a.value; });
  }

  /* ── importar ─────────────────────────────────────────────────────────── */
  function importFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var text = String(r.result);
      var rows;
      if (/\.ofx$/i.test(file.name) || /<STMTTRN>/i.test(text)) {
        rows = Q.parseOFX(text);
      } else if (/\.(csv|tsv|txt)$/i.test(file.name)) {
        rows = fromCSV(Q.parseCSV(text));
      } else {
        Q.toast("Formato no reconocido. Usa CSV u OFX; los .xlsx hay que exportarlos a CSV primero.", true);
        return;
      }
      if (!rows || !rows.length) {
        Q.toast("No encontré movimientos en ese archivo.", true);
        return;
      }
      var added = 0, dupes = 0, split = 0;
      rows.forEach(function (row) {
        var dupe = Q.db.tx.some(function (t) {
          return t.date === row.date && t.amount === row.amount &&
            t.kind === row.kind && Q.slug(t.note) === Q.slug(row.note);
        });
        if (dupe) { dupes++; return; }
        var inst = detectInstallment(row.note);
        Q.db.tx.push({
          id: Q.uid("m"), date: row.date, amount: row.amount, kind: row.kind,
          category: row.category || "Sin categoría", note: row.note,
          group: null, part: inst ? inst.part : null, parts: inst ? inst.parts : null
        });
        if (inst) split++;
        added++;
      });
      Q.save();
      render();
      Q.toast(added + " movimientos importados" +
        (dupes ? ", " + dupes + " repetidos omitidos" : "") +
        (split ? ", " + split + " con cuota detectada" : "") + ".");
    };
    r.onerror = function () { Q.toast("No se pudo leer el archivo.", true); };
    r.readAsText(file);
  }

  function fromCSV(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return Q.slug(h); });
    var find = function (names) {
      for (var i = 0; i < head.length; i++) {
        for (var j = 0; j < names.length; j++) if (head[i].indexOf(names[j]) !== -1) return i;
      }
      return -1;
    };
    var iDate = find(["fecha", "date", "data"]);
    var iAmount = find(["importe", "amount", "valor", "cantidad", "monto"]);
    var iNote = find(["concepto", "descripcion", "description", "memo", "detalle"]);
    var iCat = find(["categoria", "category", "rubro"]);
    var hasHeader = iDate !== -1 && iAmount !== -1;
    var body = hasHeader ? rows.slice(1) : rows;
    if (!hasHeader) { iDate = 0; iAmount = 1; iNote = 2; }

    return body.map(function (r) {
      var raw = (r[iDate] || "").trim();
      var date = normalizeDate(raw);
      var cents = Q.parseMoney(r[iAmount] || "");
      if (!date || isNaN(cents) || cents === 0) return null;
      return {
        date: date, amount: Math.abs(cents),
        kind: cents < 0 ? "out" : "in",
        note: (iNote !== -1 ? r[iNote] : "") || "Movimiento",
        category: iCat !== -1 ? (r[iCat] || "").trim() : ""
      };
    }).filter(Boolean);
  }

  function normalizeDate(s) {
    s = String(s).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + "-" + m[2] + "-" + m[3];
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) {
      var y = m[3].length === 2 ? "20" + m[3] : m[3];
      return y + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[1]).padStart(2, "0");
    }
    return null;
  }

  /* ── formulario ───────────────────────────────────────────────────────── */
  function form(host) {
    Q.clear(host);
    var t = editing || {};
    var f = Q.el("form", "stack");

    var g1 = Q.el("div", "grid-3");
    var kind = Q.select([{ value: "out", label: "Gasto" }, { value: "in", label: "Ingreso" }], t.kind || "out");
    g1.appendChild(Q.field("Tipo", kind));
    var amount = Q.input("text", { placeholder: "34,90", inputmode: "decimal", required: "required" });
    amount.value = t.amount ? (t.amount / 100).toFixed(2) : "";
    g1.appendChild(Q.field("Importe", amount));
    var date = Q.input("date", { required: "required" });
    date.value = t.date || Q.key(Q.today());
    g1.appendChild(Q.field("Fecha", date));
    f.appendChild(g1);

    var g2 = Q.el("div", "grid-2");
    var cats = Q.db.categories.slice();
    if (t.category && cats.indexOf(t.category) === -1) cats.push(t.category);
    var cat = Q.input("text", { list: "catList", placeholder: "Comida", maxlength: 40 });
    cat.value = t.category || "";
    g2.appendChild(Q.field("Categoría", cat));
    var parts = Q.input("number", { min: 1, max: 60, step: 1 });
    parts.value = 1;
    parts.disabled = !!editing;
    g2.appendChild(Q.field(editing ? "Cuotas (solo al crear)" : "Cuotas", parts));
    f.appendChild(g2);

    var dl = Q.el("datalist");
    dl.id = "catList";
    cats.forEach(function (c) { var o = Q.el("option"); o.value = c; dl.appendChild(o); });
    f.appendChild(dl);

    var note = Q.input("text", { maxlength: 120, placeholder: "concepto" });
    note.value = t.note || "";
    f.appendChild(Q.field("Concepto", note));

    var actions = Q.el("div", "form-actions");
    var submit = Q.el("button", "btn primary", editing ? "Guardar" : "Añadir");
    submit.type = "submit";
    actions.appendChild(submit);
    if (editing) actions.appendChild(Q.btn("btn ghost", "Cancelar", function () {
      editing = null; render();
    }));
    f.appendChild(actions);

    Q.on(f, "submit", function (ev) {
      ev.preventDefault();
      var cents = Q.parseMoney(amount.value);
      if (isNaN(cents) || cents <= 0) { Q.toast("Importe no válido.", true); return; }
      if (!date.value) { Q.toast("Falta la fecha.", true); return; }
      var c = cat.value.trim() || "Sin categoría";
      if (Q.db.categories.indexOf(c) === -1 && c !== "Sin categoría") Q.db.categories.push(c);
      if (editing) {
        editing.amount = cents; editing.kind = kind.value; editing.date = date.value;
        editing.category = c; editing.note = note.value.trim();
        editing = null;
      } else {
        var made = addTx({
          amount: cents, kind: kind.value, date: date.value,
          category: c, note: note.value.trim(), parts: parts.value
        });
        if (made.length > 1) Q.toast("Repartido en " + made.length + " cuotas mensuales.");
        month = date.value.slice(0, 7);
      }
      Q.save(); render();
    });
    host.appendChild(f);
  }

  /* ── vista ────────────────────────────────────────────────────────────── */
  function render() {
    var v = Q.$("#view-money");
    Q.clear(v);

    var fc = Q.el("section", "card");
    var fh = Q.el("div", "card-head");
    fh.appendChild(Q.el("h3", null, editing ? "Editar movimiento" : "Nuevo movimiento"));
    var tools = Q.el("div", "row-actions");
    var file = Q.input("file", { accept: ".csv,.tsv,.txt,.ofx,text/csv" });
    file.hidden = true;
    Q.on(file, "change", function () {
      if (file.files && file.files[0]) importFile(file.files[0]);
      file.value = "";
    });
    tools.appendChild(Q.btn(null, "importar CSV/OFX", function () { file.click(); }));
    tools.appendChild(file);
    fh.appendChild(tools);
    fc.appendChild(fh);
    var host = Q.el("div");
    fc.appendChild(host);
    form(host);
    v.appendChild(fc);

    var months = monthsPresent();
    if (months.indexOf(month) === -1) month = months[months.length - 1];
    var t = totals(month);

    var sum = Q.el("section", "card");
    var sh = Q.el("div", "card-head");
    sh.appendChild(Q.el("h3", null, Q.monthLabel(month)));
    var nav = Q.el("div", "segmented");
    nav.appendChild(Q.btn(null, "←", function () {
      var i = months.indexOf(month);
      if (i > 0) { month = months[i - 1]; render(); }
    }));
    var pick = Q.select(months.map(function (m) {
      return { value: m, label: Q.monthLabel(m) };
    }), month);
    Q.on(pick, "change", function () { month = pick.value; render(); });
    nav.appendChild(pick);
    nav.appendChild(Q.btn(null, "→", function () {
      var i = months.indexOf(month);
      if (i < months.length - 1) { month = months[i + 1]; render(); }
    }));
    sh.appendChild(nav);
    sum.appendChild(sh);

    var stats = Q.el("div", "stats");
    [["Ingresos", t.inc, "in"], ["Gastos", t.out, "out"], ["Saldo", t.net, "net"]]
      .forEach(function (p) {
        var s = Q.el("div", "stat");
        var b = Q.el("b", null, Q.money(p[1]));
        if (p[2] === "net") b.className = t.net < 0 ? "is-neg" : "is-pos";
        s.appendChild(b);
        s.appendChild(Q.el("span", null, p[0]));
        stats.appendChild(s);
      });
    sum.appendChild(stats);
    v.appendChild(sum);

    // Gasto por categoría: barras con etiqueta directa siempre visible.
    var byCat = categoryTotals(month);
    var catCard = Q.el("section", "card");
    var ch = Q.el("div", "card-head");
    ch.appendChild(Q.el("h3", null, "En qué se fue"));
    ch.appendChild(Q.el("span", "count", byCat.length ? byCat.length + " categorías" : ""));
    catCard.appendChild(ch);
    var vizHost = Q.el("div", "viz-host");
    catCard.appendChild(vizHost);
    // Más de 8 categorías se pliegan en "Otras": la paleta no se cicla.
    var shown = byCat.slice(0, 8);
    if (byCat.length > 8) {
      shown.push({
        label: "Otras", n: Q.sum(byCat.slice(8), function (c) { return c.n; }),
        value: Q.sum(byCat.slice(8), function (c) { return c.value; })
      });
    }
    Q.barList(vizHost, shown.map(function (c, i) {
      return {
        label: c.label, value: c.value,
        color: c.label === "Otras" ? null : Q.series(i),
        sub: c.n + (c.n === 1 ? " movimiento" : " movimientos") +
          " · " + (t.out ? Math.round(c.value / t.out * 100) : 0) + "% del gasto"
      };
    }), { fmt: function (v) { return Q.money(v); }, emptyText: "Sin gastos este mes." });
    v.appendChild(catCard);

    // Evolución mes a mes.
    if (months.length > 1) {
      var trend = Q.el("section", "card");
      var th = Q.el("div", "card-head");
      th.appendChild(Q.el("h3", null, "Gasto mes a mes"));
      trend.appendChild(th);
      var tHost = Q.el("div", "viz-host");
      trend.appendChild(tHost);
      Q.columns(tHost, months.slice(-12).map(function (m) {
        return {
          label: Q.monthLabel(m), short: Q.MONTHS_SHORT[+m.split("-")[1] - 1],
          // El mes elegido se resalta con el acento de la interfaz, no con un
          // color de serie: es un estado de selección, no otra categoría.
          value: totals(m).out,
          color: m === month ? getComputedStyle(document.documentElement)
            .getPropertyValue("--accent").trim() : null
        };
      }), { fmt: function (v) { return Q.money(v); } });
      v.appendChild(trend);
    }

    // Movimientos del mes.
    var list = Q.el("section", "card");
    var lh = Q.el("div", "card-head");
    lh.appendChild(Q.el("h3", null, "Movimientos"));
    lh.appendChild(Q.el("span", "count", t.rows.length ? t.rows.length + "" : ""));
    list.appendChild(lh);
    if (!t.rows.length) {
      list.appendChild(Q.el("p", "empty", "Nada este mes."));
    } else {
      var ul = Q.el("ul", "rows");
      t.rows.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (tx) {
        var li = Q.el("li", "row");
        var body = Q.el("div", "row-body");
        body.appendChild(Q.el("span", "row-title", tx.note || tx.category));
        var meta = Q.el("span", "row-meta");
        meta.appendChild(Q.el("span", "chip is-quiet", Q.shortDate(Q.parseKey(tx.date))));
        meta.appendChild(Q.el("span", "chip is-quiet", tx.category));
        if (tx.parts) meta.appendChild(Q.el("span", "chip", "cuota " + tx.part + "/" + tx.parts));
        body.appendChild(meta);
        li.appendChild(body);
        var amt = Q.el("span", "amount " + (tx.kind === "in" ? "is-pos" : "is-neg"),
          (tx.kind === "in" ? "+" : "−") + Q.money(tx.amount));
        li.appendChild(amt);
        var acts = Q.el("div", "row-actions");
        acts.appendChild(Q.btn(null, "editar", function () {
          editing = tx; render(); window.scrollTo({ top: 0 });
        }));
        acts.appendChild(Q.btn("del", "borrar", function () {
          var others = tx.group ? Q.db.tx.filter(function (x) { return x.group === tx.group; }).length : 1;
          var msg = others > 1
            ? "Esto forma parte de " + others + " cuotas. ¿Borrar todas?"
            : "¿Borrar este movimiento?";
          if (!window.confirm(msg)) return;
          Q.db.tx = Q.db.tx.filter(function (x) {
            return tx.group ? x.group !== tx.group : x.id !== tx.id;
          });
          Q.save(); render();
        }));
        li.appendChild(acts);
        ul.appendChild(li);
      });
      list.appendChild(ul);
    }
    list.appendChild(Q.el("p", "muted small",
      "Importa extractos en CSV u OFX. Los .xlsx hay que guardarlos como CSV antes — no llevo un lector de Excel dentro. Los repetidos se detectan y se omiten."));
    v.appendChild(list);
  }

  Q.view("money", render);
  // Ojo: NO usar QP.money — ese nombre es el formateador de importes del
  // núcleo, y asignarlo aquí lo dejaría inservible en toda la app.
  QP.finance = {
    totals: totals, categoryTotals: categoryTotals, monthsPresent: monthsPresent,
    detectInstallment: detectInstallment, addTx: addTx, fromCSV: fromCSV
  };
})();


/* ─── qp/study.js ─── */
/* Estudio: asignaturas, temas, horas registradas y Pomodoro.
   El temporizador vive fuera del render para que cambiar de pestaña no lo
   reinicie, y se calcula por marca de tiempo: si el navegador ralentiza los
   intervalos en segundo plano, el reloj sigue siendo correcto. */
(function () {
  "use strict";
  var Q = QP;
  var editingSubject = null;
  /* Qué asignaturas están desplegadas. Se guarda aparte del DOM para que
     añadir un tema no cierre el bloque que estabas usando. */
  var openSubjects = {};

  var timer = {
    phase: "work",     // work | short | long
    running: false,
    endsAt: 0,
    left: 0,           // segundos restantes cuando está en pausa
    round: 1,
    subjectId: null,
    tick: null
  };

  function cfg() { return Q.db.settings.pomo; }
  function phaseMinutes(p) {
    var c = cfg();
    return p === "work" ? c.work : p === "short" ? c.short : c.long;
  }
  function secondsLeft() {
    if (timer.running) return Math.max(0, Math.round((timer.endsAt - Date.now()) / 1000));
    return timer.left;
  }
  function fmtClock(s) {
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function setPhase(p, autoStart) {
    timer.phase = p;
    timer.left = phaseMinutes(p) * 60;
    timer.running = false;
    if (autoStart) start();
    paint();
  }
  function start() {
    if (timer.running) return;
    if (!timer.left) timer.left = phaseMinutes(timer.phase) * 60;
    timer.endsAt = Date.now() + timer.left * 1000;
    timer.running = true;
    if (timer.tick) clearInterval(timer.tick);
    timer.tick = setInterval(onTick, 500);
    paint();
  }
  function pause() {
    if (!timer.running) return;
    timer.left = secondsLeft();
    timer.running = false;
    clearInterval(timer.tick);
    timer.tick = null;
    paint();
  }
  function reset() {
    pause();
    timer.left = phaseMinutes(timer.phase) * 60;
    paint();
  }

  function onTick() {
    if (!timer.running) return;
    if (secondsLeft() > 0) { paint(); return; }
    // Fin de fase.
    clearInterval(timer.tick);
    timer.tick = null;
    timer.running = false;
    timer.left = 0;
    var wasWork = timer.phase === "work";
    if (wasWork) {
      logSession(phaseMinutes("work"), timer.subjectId, "pomodoro");
      chime();
      var c = cfg();
      var isLong = timer.round % c.rounds === 0;
      timer.round++;
      Q.toast("Pomodoro completado. Toca " + (isLong ? "descanso largo" : "descanso corto") + ".");
      setPhase(isLong ? "long" : "short", false);
    } else {
      chime();
      Q.toast("Se acabó el descanso.");
      setPhase("work", false);
    }
  }

  /* Un pitido corto con WebAudio: no hace falta ningún archivo de sonido. */
  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.95);
      setTimeout(function () { ctx.close(); }, 1200);
    } catch (e) { /* sin sonido, no pasa nada */ }
  }

  function logSession(minutes, subjectId, kind) {
    if (minutes <= 0) return;
    Q.db.sessions.push({
      id: Q.uid("ss"), date: Q.key(Q.today()), minutes: Math.round(minutes),
      subjectId: subjectId || null, kind: kind || "manual"
    });
    Q.save();
  }

  function minutesOn(dateKey, subjectId) {
    return Q.sum(Q.db.sessions.filter(function (s) {
      return s.date === dateKey && (!subjectId || s.subjectId === subjectId);
    }), function (s) { return s.minutes; });
  }
  function subjectMinutes(subjectId) {
    return Q.sum(Q.db.sessions.filter(function (s) { return s.subjectId === subjectId; }),
      function (s) { return s.minutes; });
  }
  function fmtHours(min) {
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    return h ? h + " h " + (m ? m + " min" : "") : m + " min";
  }

  /* ── pintado del reloj sin volver a construir la vista entera ─────────── */
  function paint() {
    var clock = Q.$("#pomoClock");
    if (!clock) return;
    var s = secondsLeft();
    clock.textContent = fmtClock(s);
    var ring = Q.$("#pomoRing");
    if (ring) {
      var total = phaseMinutes(timer.phase) * 60 || 1;
      ring.style.setProperty("--p", (1 - s / total));
      ring.dataset.phase = timer.phase;
    }
    var label = Q.$("#pomoPhase");
    if (label) {
      label.textContent = timer.phase === "work"
        ? "Concentración · ronda " + timer.round
        : timer.phase === "short" ? "Descanso corto" : "Descanso largo";
    }
    var pp = Q.$("#pomoToggle");
    if (pp) pp.textContent = timer.running ? "Pausar" : "Empezar";
    document.title = timer.running
      ? fmtClock(s) + " · Quiet Process"
      : "Quiet Process";
  }

  /* ── vista ────────────────────────────────────────────────────────────── */
  function render() {
    var v = Q.$("#view-study");
    Q.clear(v);

    /* Pomodoro */
    var pomo = Q.el("section", "card");
    var ph = Q.el("div", "card-head");
    ph.appendChild(Q.el("h3", null, "Pomodoro"));
    ph.appendChild(Q.el("span", "count", "hoy: " + fmtHours(minutesOn(Q.key(Q.today())))));
    pomo.appendChild(ph);

    var box = Q.el("div", "pomo");
    var ring = Q.el("div", "pomo-ring");
    ring.id = "pomoRing";
    var clock = Q.el("div", "pomo-clock");
    clock.id = "pomoClock";
    clock.setAttribute("aria-live", "off");
    ring.appendChild(clock);
    box.appendChild(ring);

    var side = Q.el("div", "pomo-side");
    var phase = Q.el("p", "pomo-phase");
    phase.id = "pomoPhase";
    side.appendChild(phase);

    var subj = Q.select(QP.tasks.subjectOptions(), timer.subjectId || "");
    Q.on(subj, "change", function () { timer.subjectId = subj.value || null; });
    side.appendChild(Q.field("Asignatura", subj));

    var controls = Q.el("div", "form-actions");
    var toggle = Q.btn("btn primary", "Empezar", function () {
      timer.running ? pause() : start();
    });
    toggle.id = "pomoToggle";
    controls.appendChild(toggle);
    controls.appendChild(Q.btn("btn ghost", "Reiniciar", reset));
    controls.appendChild(Q.btn("btn ghost", "Saltar", function () {
      pause();
      if (timer.phase === "work") { timer.round++; setPhase("short", false); }
      else setPhase("work", false);
    }));

        Q.db.subjects.push({

        });
      }
      Q.save(); render();
    });
    subjects.appendChild(f);

    if (!Q.db.subjects.length) {
      subjects.appendChild(Q.el("p", "empty",
        "Sin asignaturas. Añade una y cuelga temas, tareas, notas y horas de Pomodoro."));
    } else {
      Q.db.subjects.forEach(function (s) {
        var det = Q.el("details", "subject");
        det.open = !!openSubjects[s.id];
        Q.on(det, "toggle", function () { openSubjects[s.id] = det.open; });
        var sm = Q.el("summary");
        var dot = Q.el("span", "hue-dot");
        dot.style.background = s.color;
        sm.appendChild(dot);
        sm.appendChild(Q.el("strong", null, s.name));
        var doneT = (s.topics || []).filter(function (t) { return t.done; }).length;
        sm.appendChild(Q.el("span", "count",
          (s.topics || []).length ? doneT + "/" + s.topics.length + " temas · " + fmtHours(subjectMinutes(s.id))
            : fmtHours(subjectMinutes(s.id))));
        det.appendChild(sm);

        var inner = Q.el("div", "subject-body");
        var ul = Q.el("ul", "rows tight");
        (s.topics || []).forEach(function (t) {
          var li = Q.el("li", "row" + (t.done ? " is-done" : ""));

          var acts = Q.el("div", "row-actions");

        var tf = Q.el("form", "quickadd");

        var tb = Q.el("button", "btn ghost small", "+");
        tb.type = "submit";
        tf.appendChild(tb);
        Q.on(tf, "submit", function (ev) {
          ev.preventDefault();

          s.topics = s.topics || [];

          Q.save(); render();

        inner.appendChild(tf);

        var acts2 = Q.el("div", "row-actions");
        acts2.appendChild(Q.btn(null, "renombrar", function () { editingSubject = s; render(); }));
        acts2.appendChild(Q.btn("del", "borrar asignatura", function () {
          if (!window.confirm("¿Borrar «" + s.name + "»? Sus horas registradas se quedan sin asignatura.")) return;
          Q.db.subjects = Q.db.subjects.filter(function (x) { return x.id !== s.id; });
          Q.db.sessions.forEach(function (ss) { if (ss.subjectId === s.id) ss.subjectId = null; });
          Q.db.tasks.forEach(function (t) { if (t.subjectId === s.id) t.subjectId = null; });

        inner.appendChild(acts2);
        det.appendChild(inner);

/* Reflejo: el diario, los mapas de calor de hábitos y las cifras del proceso. */
(function () {
  "use strict";
  var Q = QP;
  var WEEKS = 12;
  var query = "";
  var onlyNotes = true;   // por defecto, sólo los días que escribiste
  var shown = 30;         // paginación: el diario de un año no cabe de golpe

  var MOOD_LABEL = ["", "duro", "flojo", "normal", "bien", "pleno"];

  function heatmap(host, h) {
    var end = Q.today();
    var gridEnd = Q.addDays(end, 6 - end.getDay());   // sábado de esta semana
    var gridStart = Q.addDays(gridEnd, -(WEEKS * 7 - 1)); // cae en domingo
    var start = QP.tasks.habitStart(h);

    var map = Q.el("div", "heatmap");
    var labels = Q.el("div", "daylabels");
    Q.DAY_SHORT.forEach(function (s) { labels.appendChild(Q.el("span", null, s)); });
    map.appendChild(labels);

    // Columnas = semanas, filas = días de la semana.
    var cells = Q.el("div", "cells");
    for (var d = new Date(gridStart); d <= gridEnd; d = Q.addDays(d, 1)) {
      var c = Q.el("div", "cell");
      var before = d < start;
      if (d > end) c.classList.add("future");
      if (!QP.tasks.scheduled(h, d) || before) c.classList.add("off");
      else if (QP.tasks.habitDone(h, d)) c.style.background = h.color || Q.HUES[0];
      c.title = Q.longDate(d) + (before || !QP.tasks.scheduled(h, d) ? ""
        : QP.tasks.habitDone(h, d) ? " — hecho" : " — sin marcar");
      cells.appendChild(c);
    }
    map.appendChild(cells);
    host.appendChild(map);
  }

  function render() {
    var v = Q.$("#view-review");
    Q.clear(v);

    /* Cifras */
    var habits = QP.tasks.activeHabits();
    var stats = Q.el("section", "card");
    var sh = Q.el("div", "card-head");
    sh.appendChild(Q.el("h3", null, "El proceso"));
    sh.appendChild(Q.el("span", "count", WEEKS + " semanas"));
    stats.appendChild(sh);

    var due = 0, hit = 0, best = 0;
    habits.forEach(function (h) {
      var r = QP.tasks.rate(h, WEEKS * 7);
      due += r.due; hit += r.hit;
      best = Math.max(best, QP.tasks.streak(h));
    });
    var notes = Object.keys(Q.db.log).filter(function (k) {
      return (Q.db.log[k].note || "").trim();
    }).length;
    var doneTasks = Q.db.tasks.filter(function (t) { return t.done; }).length;
    var studyMin = Q.sum(Q.db.sessions, function (s) { return s.minutes; });

    var row = Q.el("div", "stats");
    [
      [due ? Math.round(hit / due * 100) + "%" : "—", "hábitos cumplidos"],
      [String(best), best === 1 ? "día seguido (mejor)" : "días seguidos (mejor)"],
      [String(doneTasks), doneTasks === 1 ? "tarea hecha" : "tareas hechas"],
      [QP.study.fmtHours(studyMin), "estudiadas"],
      [String(Q.db.workouts.length), Q.db.workouts.length === 1 ? "entreno" : "entrenos"],
      [String(notes), notes === 1 ? "nota de diario" : "notas de diario"]
    ].forEach(function (p) {
      var s = Q.el("div", "stat");
      s.appendChild(Q.el("b", null, p[0]));
      s.appendChild(Q.el("span", null, p[1]));
      row.appendChild(s);
    });
    stats.appendChild(row);
    v.appendChild(stats);

    /* Mapas de calor */
    var grids = Q.el("section", "card");
    var gh = Q.el("div", "card-head");
    gh.appendChild(Q.el("h3", null, "Últimas semanas"));
    grids.appendChild(gh);
    if (!habits.length) {
      grids.appendChild(Q.el("p", "empty",
        "Cuando tengas hábitos y algunos días marcados, aquí verás el patrón."));
    } else {
      habits.forEach(function (h) {
        var block = Q.el("div", "gridrow");
        var head = Q.el("div", "gridrow-head");
        var dot = Q.el("span", "hue-dot");
        dot.style.background = h.color || Q.HUES[0];
        head.appendChild(dot);
        head.appendChild(Q.el("span", null, h.name));
        var r = QP.tasks.rate(h, WEEKS * 7);
        head.appendChild(Q.el("span", "pct", r.pct + "% · " + r.hit + "/" + r.due));
        block.appendChild(head);
        heatmap(block, h);
        block.appendChild(Q.el("p", "gridrow-foot", "hace " + WEEKS + " semanas  →  hoy"));
        grids.appendChild(block);
      });
    }
    v.appendChild(grids);

    /* Ánimo */
    var moodCard = Q.el("section", "card");
    var mh = Q.el("div", "card-head");
    mh.appendChild(Q.el("h3", null, "Ánimo"));
    mh.appendChild(Q.el("span", "count", "últimos 30 días"));
    moodCard.appendChild(mh);
    var chart = Q.el("div", "moodchart");
    var any = false;
    for (var i = 29; i >= 0; i--) {
      var d = Q.addDays(Q.today(), -i);
      var e = Q.db.log[Q.key(d)];
      var val = e && e.mood ? e.mood : 0;
      if (val) any = true;
      var bar = Q.el("div", "bar" + (val ? " on" : ""));
      bar.style.height = val ? (val / 5 * 100) + "%" : "3px";
      bar.title = Q.longDate(d) + (val ? " — " + MOOD_LABEL[val] : " — sin registrar");
      chart.appendChild(bar);
    }
    moodCard.appendChild(chart);
    moodCard.appendChild(Q.el("p", "muted small", any
      ? "Los huecos son días sin registrar — también cuentan como parte del proceso."
      : "Todavía sin registros de ánimo. Se marca desde la pestaña Hoy."));
    v.appendChild(moodCard);

    /* Diario */
    var journal = Q.el("section", "card");
    var jh = Q.el("div", "card-head");
    jh.appendChild(Q.el("h3", null, "Diario"));
    journal.appendChild(jh);
    var tools = Q.el("div", "toolbar");
    var search = Q.input("search", { placeholder: "buscar una palabra…" });
    search.value = query;
    var listHost = Q.el("div");
    Q.on(search, "input", function () {
      query = search.value; shown = 30; drawJournal(listHost);
    });
    tools.appendChild(search);
    var lbl = Q.el("label", "toggle");
    var cb = Q.input("checkbox", {});
    cb.checked = !onlyNotes;
    Q.on(cb, "change", function () {
      onlyNotes = !cb.checked; shown = 30; drawJournal(listHost);
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(" incluir días sin nota escrita"));
    tools.appendChild(lbl);
    journal.appendChild(tools);
    journal.appendChild(listHost);
    drawJournal(listHost);
    v.appendChild(journal);
  }

  function drawJournal(host) {
    Q.clear(host);
    var q = Q.slug(query);
    var keys = Object.keys(Q.db.log).filter(function (k) {
      var e = Q.db.log[k];
      if (!e) return false;
      var written = (e.note || "").trim();
      if (onlyNotes) { if (!written) return false; }
      else {
        var has = written || e.mood ||
          Object.keys(e.habits || {}).some(function (id) { return e.habits[id]; });
        if (!has) return false;
      }
      if (!q) return true;
      return Q.slug(e.note || "").indexOf(q) !== -1 || k.indexOf(q) !== -1;
    }).sort().reverse();

    if (!keys.length) {
      host.appendChild(Q.el("p", "empty", query
        ? "Nada coincide con «" + query + "»."
        : onlyNotes
          ? "Ningún día con nota escrita todavía. Se escriben desde «Hoy» — o marca la casilla para ver también los días sólo marcados."
          : "Sin entradas todavía."));
      return;
    }

    var ol = Q.el("ol", "entries");
    keys.slice(0, shown).forEach(function (k) {
      var e = Q.db.log[k];
      var d = Q.parseKey(k);
      var li = Q.el("li");
      var head = Q.el("div", "entry-head");
      head.appendChild(Q.el("span", "entry-date", Q.longDate(d)));
      if (e.mood) {
        var mo = Q.el("span", "entry-mood");
        var f = Q.el("i");
        f.style.height = (e.mood * 20) + "%";
        mo.appendChild(f);
        mo.title = MOOD_LABEL[e.mood];
        head.appendChild(mo);
      }
      var hits = Object.keys(e.habits || {}).filter(function (id) { return e.habits[id]; }).length;
      var dueCount = QP.tasks.habitsDueOn(d).length;
      if (dueCount) head.appendChild(Q.el("span", "entry-tally", hits + "/" + dueCount + " prácticas"));
      li.appendChild(head);
      if ((e.note || "").trim()) li.appendChild(Q.el("p", "entry-text", e.note));
      ol.appendChild(li);
    });
    host.appendChild(ol);
    if (keys.length > shown) {
      var rest = keys.length - shown;
      host.appendChild(Q.btn("btn ghost",
        "Mostrar " + Math.min(30, rest) + " más  ·  quedan " + rest, function () {
          shown += 30;
          drawJournal(host);
        }));
    }
  }

  Q.view("review", render);
})();
