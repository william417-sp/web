     ["Supermercado", "Comida", 18760], ["Gasolina", "Transporte", 8990],
     ["Cine", "Ocio", 2400], ["Farmacia", "Salud", 1845],
     ["Restaurante", "Ocio", 4720], ["Abono transporte", "Transporte", 5450]
    ].forEach(function (r, i) { add(K(i * 3), r[2], "out", r[1], r[0]); });
    add(K(18), 230000, "in", "Trabajo", "Nómina");
    [0, 1, 2].forEach(function (i) {
      add(Q.key(Q.addMonths(Q.parseKey(K(20)), i)), 9158, "out", "Casa", "Portátil", i + 1, 12, "dgrp");
    });
    [1, 2, 3].forEach(function (m) {
      ["Comida", "Casa", "Ocio", "Transporte"].forEach(function (c) {
        add(M(m), 18000 + Math.floor(Math.random() * 55000), "out", c, c);
      });
      add(M(m), 230000, "in", "Trabajo", "Nómina");
    });

    var subjects = [
      { id: "ds1", name: "Estadística", color: Q.HUES[1], topics: [
        { id: "dtp1", name: "Inferencia", done: true },
        { id: "dtp2", name: "Bootstrapping", done: true },
        { id: "dtp3", name: "Modelos mixtos", done: false }] },
      { id: "ds2", name: "Escritura académica", color: Q.HUES[2], topics: [
        { id: "dtp4", name: "Estructura IMRyD", done: true },
        { id: "dtp5", name: "Citación", done: false }] }
    ];

    var sessions = [];
    for (var j = 0; j < 14; j++) {
      if (!pick(0.65)) continue;
      sessions.push({
        id: "dss" + j, date: K(j), minutes: 25 * (1 + Math.floor(Math.random() * 3)),
        subjectId: pick(0.6) ? "ds1" : "ds2", kind: "pomodoro"
      });
    }
    sessions.push({ id: "dssx", date: K(0), minutes: 50, subjectId: "ds1", kind: "pomodoro" });

    var d = Q.blank();
    d.createdAt = K(80);
    d.demo = true;
    d.habits = habits; d.log = log; d.tasks = tasks; d.goals = goals;
    d.notes = notes; d.exercises = exercises; d.workouts = workouts;
    d.tx = tx; d.subjects = subjects; d.sessions = sessions;
    d.categories = ["Casa", "Comida", "Transporte", "Salud", "Ocio", "Trabajo"];
    return d;
  }

  function load() {
    Q.db = build();
    Q.db.demo = true;          // normalize() no lo conoce, así que se repone
    Q.save(true);
    QP.tasks.resetCursor();
    Q.show("today");
    Q.toast("Datos de ejemplo cargados. Bórralos cuando quieras empezar de cero.");
  }

  function wipe() {
    if (!window.confirm("Se borran los datos de ejemplo y empiezas con todo vacío. ¿Seguir?")) return;
    Q.db = Q.blank();
    Q.save(true);
    QP.tasks.resetCursor();
    Q.show("today");
    Q.toast("Listo. Todo tuyo.");
  }

  /* Aviso permanente mientras haya datos de ejemplo: nadie debe confundirlos
     con los suyos. */
  function banner() {
    if (!Q.db.demo) return null;
    var b = Q.el("div", "demo-bar");
    b.appendChild(Q.el("span", null, "Estás viendo datos de ejemplo."));
    b.appendChild(Q.btn("linkish", "Borrarlos y empezar de cero", wipe));
    return b;
  }

  /* Portada de la primera visita. Sustituye a la pantalla vacía. */
  function welcome() {
    var card = Q.el("section", "card welcome");
    card.appendChild(Q.el("h2", null, "Bienvenido a Quiet Process"));
    card.appendChild(Q.el("p", "welcome-lead",
      "Tareas, hábitos, metas, notas, entrenos, dinero y estudio en un solo sitio. " +
      "Sin cuentas y sin nube: todo se queda en este navegador."));

    var list = Q.el("ul", "welcome-list");
    [["Hoy", "hábitos y tareas del día en una sola lista"],
     ["Tareas", "lista, matriz de Eisenhower y tablero"],
     ["Metas", "el progreso sale solo de lo que ya haces"],
     ["Notas", "enlaces [[así]] y un grafo de todo"],
     ["Entreno", "series, récords y evolución"],
     ["Dinero", "cuotas e importación de extractos"],
     ["Estudio", "Pomodoro, asignaturas y horas"],
     ["Reflejo", "mapas de calor y diario"]].forEach(function (p) {
      var li = Q.el("li");
      li.appendChild(Q.el("strong", null, p[0]));
      li.appendChild(Q.el("span", null, p[1]));
      list.appendChild(li);
    });
    card.appendChild(list);

    var acts = Q.el("div", "form-actions");
    acts.appendChild(Q.btn("btn primary", "Ver con datos de ejemplo", load));
    acts.appendChild(Q.btn("btn ghost", "Empezar de cero", function () {
      dismissed = true;
      Q.refresh();
      Q.toast("Escribe algo arriba, o crea un hábito en la pestaña Hábitos.");
    }));
    card.appendChild(acts);
    card.appendChild(Q.el("p", "muted small",
      "Los datos de ejemplo son inventados y se borran de un clic. No tocan nada tuyo."));
    return card;
  }

  var dismissed = false;
  function shouldWelcome() { return !dismissed && isEmpty(); }

  QP.demo = {
    isEmpty: isEmpty, shouldWelcome: shouldWelcome,
    welcome: welcome, banner: banner, load: load, wipe: wipe
  };
})();


/* ─── qp/boot.js ─── */
/* Arranque: pestañas, tema, panel de datos y cambio de día. */
(function () {
  "use strict";
  var Q = QP;

  /* El tema por defecto es oscuro. Quien prefiera otra cosa la elige con el
     botón y su elección manda: "system" queda guardada como decisión, no como
     ausencia de decisión, para que el arranque no vuelva a poner oscuro. */
  var DEFAULT_THEME = "dark";

  function storedTheme() {
    try {
      var t = localStorage.getItem(Q.THEME_KEY);
      if (t === "light" || t === "dark" || t === "system") return t;
    } catch (e) { /* modo privado */ }
    return DEFAULT_THEME;
  }

  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");   // "system"
  }

  function cycleTheme() {
    var order = ["dark", "light", "system"];
    var next = order[(order.indexOf(storedTheme()) + 1) % order.length];
    applyTheme(next);
    try { localStorage.setItem(Q.THEME_KEY, next); } catch (e) { /* modo privado */ }
    Q.toast(next === "dark" ? "Tema oscuro."
      : next === "light" ? "Tema claro." : "Tema del sistema.");
    Q.refresh();
  }

  /* ── panel de datos ───────────────────────────────────────────────────── */
  function exportJSON() {
    Q.download("quiet-process-" + Q.key(Q.today()) + ".json",
      JSON.stringify(Q.db, null, 2), "application/json");
    msg("Copia descargada.");
  }

  function exportCSV() {
    var rows = [["tipo", "fecha", "titulo", "detalle", "valor"]];
    Q.db.tasks.forEach(function (t) {
      rows.push(["tarea", t.due || t.createdAt || "", t.title, t.note || "", t.done ? "hecha" : "pendiente"]);
    });
    Object.keys(Q.db.log).sort().forEach(function (k) {
      var e = Q.db.log[k];
      if ((e.note || "").trim()) rows.push(["diario", k, "", e.note, e.mood || ""]);
      Object.keys(e.habits || {}).forEach(function (id) {
        if (!e.habits[id]) return;
        var h = Q.byId(Q.db.habits, id);
        rows.push(["habito", k, h ? h.name : id, "", "hecho"]);
      });
    });
    Q.db.tx.forEach(function (t) {
      rows.push(["dinero", t.date, t.note || t.category, t.category,
        (t.kind === "out" ? "-" : "") + (t.amount / 100).toFixed(2)]);
    });
    Q.db.workouts.forEach(function (w) {
      (w.sets || []).forEach(function (s) {
        var e = Q.byId(Q.db.exercises, s.exerciseId);
        rows.push(["serie", w.date, e ? e.name : s.exerciseId, s.reps + " reps", s.weight]);
      });
    });
    Q.db.sessions.forEach(function (s) {
      var sub = s.subjectId && Q.byId(Q.db.subjects, s.subjectId);
      rows.push(["estudio", s.date, sub ? sub.name : "sin asignatura", s.kind, s.minutes]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? "" : c);
        return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    Q.download("quiet-process-" + Q.key(Q.today()) + ".csv", "﻿" + csv, "text/csv");
    msg("CSV descargado.");
  }

  function importJSON(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        var looksRight = d && typeof d === "object" &&
          (Array.isArray(d.habits) || Array.isArray(d.tasks)) &&
          d.log && typeof d.log === "object";
        if (!looksRight) throw new Error("forma");
        if (!window.confirm("Esto reemplaza todo lo que tienes ahora. ¿Seguir?")) return;
        Q.db = d;
        Q.save(true);
        QP.tasks.resetCursor();
        Q.refresh();
        msg("Copia importada.");
      } catch (e) {
        msg("Ese archivo no parece una copia de Quiet Process.", true);
      }
    };
    r.onerror = function () { msg("No se pudo leer el archivo.", true); };
    r.readAsText(file);
  }

  function wipe() {
    if (!window.confirm("Se borra todo: hábitos, tareas, notas, metas, entrenos, dinero y estudio. ¿Seguro?")) return;
    if (!window.confirm("Última confirmación: esto no se puede deshacer.")) return;
    Q.db = Q.blank();
    try { localStorage.removeItem(Q.KEY); } catch (e) { /* nada que hacer */ }
    Q.save(true);
    QP.tasks.resetCursor();
    Q.refresh();
    msg("Todo borrado.");
  }

  var msgTimer = null;
  function msg(t, isError) {
    var n = Q.$("#dataMsg");
    if (!n) return;
    n.textContent = t;
    n.classList.toggle("is-error", !!isError);
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { n.textContent = ""; }, 3500);
  }

  function usedSpace() {
    try {
      var bytes = new Blob([localStorage.getItem(Q.KEY) || ""]).size;
      return bytes < 1024 ? bytes + " B"
        : bytes < 1048576 ? (bytes / 1024).toFixed(0) + " KB"
          : (bytes / 1048576).toFixed(1) + " MB";
    } catch (e) { return "?"; }
  }

  function openData() {
    var dlg = Q.$("#dataDialog");
    var body = Q.$("#dataBody");
    Q.clear(body);

    var counts = [
      [Q.db.habits.length, "hábitos"], [Q.db.tasks.length, "tareas"],
      [Q.db.goals.length, "metas"], [Q.db.notes.length, "notas"],
      [Q.db.workouts.length, "entrenos"], [Q.db.tx.length, "movimientos"],
      [Q.db.subjects.length, "asignaturas"], [Object.keys(Q.db.log).length, "días registrados"]
    ].filter(function (c) { return c[0]; });
    if (counts.length) {
      body.appendChild(Q.el("p", "muted small",
        counts.map(function (c) { return c[0] + " " + c[1]; }).join(" · ") +
        " · " + usedSpace() + " usados"));
    }

    var cur = Q.el("div", "grid-2");
    var currency = Q.input("text", { maxlength: 3, placeholder: "EUR" });
    currency.value = Q.db.settings.currency;
    Q.on(currency, "change", function () {
      Q.db.settings.currency = (currency.value || "EUR").toUpperCase().slice(0, 3);
      Q.save(); Q.refresh();
    });
    cur.appendChild(Q.field("Moneda", currency));
    var locale = Q.input("text", { maxlength: 12, placeholder: "es-ES" });
    locale.value = Q.db.settings.locale;
    Q.on(locale, "change", function () {
      Q.db.settings.locale = locale.value || "es-ES";
      Q.save(); Q.refresh();
    });
    cur.appendChild(Q.field("Formato", locale));
    body.appendChild(cur);

    var acts = Q.el("div", "dialog-actions");
    acts.appendChild(Q.btn("btn", "Exportar copia (.json)", exportJSON));
    acts.appendChild(Q.btn("btn", "Exportar todo a CSV", exportCSV));
    var file = Q.input("file", { accept: "application/json,.json" });
    file.hidden = true;
    Q.on(file, "change", function () {
      if (file.files && file.files[0]) importJSON(file.files[0]);
      file.value = "";
    });
    acts.appendChild(Q.btn("btn", "Importar copia", function () { file.click(); }));
    acts.appendChild(file);
    acts.appendChild(Q.btn("btn danger", "Borrar todo", wipe));
    body.appendChild(acts);

    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
  }

  /* ── arranque ─────────────────────────────────────────────────────────── */
  function init() {
    applyTheme(storedTheme());

    Q.$$(".tab").forEach(function (t) {
      Q.on(t, "click", function () { Q.show(t.dataset.view); });
    });
    Q.on(Q.$("#themeBtn"), "click", cycleTheme);
    Q.on(Q.$("#dataBtn"), "click", openData);

    // Atajos: 1-8 saltan de pestaña cuando no estás escribiendo.
    Q.on(document, "keydown", function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      var t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      var tabs = Q.$$(".tab");
      var n = parseInt(ev.key, 10);
      if (n >= 1 && n <= tabs.length) { Q.show(tabs[n - 1].dataset.view); ev.preventDefault(); }
    });

    // Si la pestaña se queda abierta de un día para otro, la vista se pone al
    // día sola — pero sin arrastrar al usuario si estaba mirando otro día.
    var openedOn = Q.key(Q.today());
    Q.on(document, "visibilitychange", function () {
      if (document.hidden) return;
      var now = Q.key(Q.today());
      if (now === openedOn) return;
      openedOn = now;
      QP.tasks.resetCursor();
      Q.refresh();
    });

    var start = "today";
    try {
      var saved = localStorage.getItem("quiet-process.tab");
      if (saved) start = saved;
    } catch (e) { /* privado */ }
    Q.show(start);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
