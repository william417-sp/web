<script>

<style>
/* Quiet Process — hoja única. Tokens en :root, oscuro por sistema y por
   interruptor, y ninguna dependencia externa. */

:root{
  color-scheme: light;
  --bg:#f4f2ed; --bg-soft:#eae7e0; --surface:#fbfaf7;
  --line:#ddd8ce; --line-soft:#e8e4db;
  --ink:#2c2f2c; --ink-soft:#5f645e; --ink-faint:#8b8f88;
  --accent:#6f8a75; --accent-soft:#dfe7e0;
  --danger:#a35a4f; --danger-soft:#f3e3e0;
  --pos:#3f7a55; --neg:#a35a4f;
  --radius:14px;
  --shadow:0 1px 2px rgba(44,47,44,.05), 0 8px 24px -18px rgba(44,47,44,.35);
  /* La pila de serifas baja por plataformas: Apple, Windows, y después las
     que sí existen en Linux y Android — sin ellas, ahí caía en una serif
     genérica y la voz de la interfaz se perdía. */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Charter","Bitstream Charter",
          "Noto Serif","Liberation Serif",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#181a19; --bg-soft:#202322; --surface:#1f2221;
    --line:#333835; --line-soft:#2a2e2c;
    --ink:#e6e5df; --ink-soft:#a8ada6; --ink-faint:#7b8079;
    --accent:#8fae96; --accent-soft:#2b3630;
    --danger:#c88276; --danger-soft:#3a2b28;
    --pos:#8fae96; --neg:#c88276;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#181a19; --bg-soft:#202322; --surface:#1f2221;
  --line:#333835; --line-soft:#2a2e2c;
  --ink:#e6e5df; --ink-soft:#a8ada6; --ink-faint:#7b8079;
  --accent:#8fae96; --accent-soft:#2b3630;
  --danger:#c88276; --danger-soft:#3a2b28;
  --pos:#8fae96; --neg:#c88276;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.9);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55; letter-spacing:.01em;
}
h1,h2,h3,h4{ font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0; }
p{ margin:0; }
button,input,textarea,select{ font:inherit; color:inherit; }
.muted{ color:var(--ink-soft); }
.small{ font-size:.82rem; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ── cabecera ── */
.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.top-inner{
  max-width:1000px; margin:0 auto; padding:16px 20px 8px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.mark{
  width:26px; height:26px; flex:none; border-radius:50%;
  border:2.5px solid var(--accent); box-shadow:inset 0 0 0 3px var(--bg);
}
.brand h1{ font-size:1.25rem; line-height:1.2; }
.tagline{ font-size:.76rem; color:var(--ink-faint); font-style:italic; }
.top-actions{ display:flex; gap:6px; }
.icon-btn{
  width:34px; height:34px; border-radius:9px; background:transparent;
  border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; line-height:1;
  transition:background .18s, color .18s;
}
.icon-btn:hover{ background:var(--bg-soft); color:var(--ink); }

.tabs{
  max-width:1000px; margin:0 auto; padding:0 14px;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin;
}
.tab{
  appearance:none; background:none; border:0; cursor:pointer;
  padding:8px 11px 11px; color:var(--ink-faint); font-size:.88rem;
  border-bottom:2px solid transparent; white-space:nowrap;
  transition:color .18s, border-color .18s;
}
.tab:hover{ color:var(--ink-soft); }
.tab.is-active{ color:var(--ink); border-bottom-color:var(--accent); }

/* ── layout ── */
main{ max-width:1000px; margin:0 auto; padding:22px 20px 60px; }
.view{ display:none; }
.view.is-active{ display:block; animation:rise .26s ease both; }
@keyframes rise{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){
  .view.is-active{ animation:none; }
  *{ transition-duration:.01ms !important; }
}

.card{
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:20px; margin-bottom:18px;
}
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:14px; flex-wrap:wrap;
}
.card-head h3{ font-size:1.02rem; }
.count{ font-size:.76rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.empty{ color:var(--ink-faint); font-size:.9rem; font-style:italic; padding:6px 0; }

/* ── formularios ── */
.stack > * + *{ margin-top:14px; }
.stack-tight > * + *{ margin-top:8px; }
.field{ display:block; border:0; padding:0; margin:0; }
.field + .field{ margin-top:14px; }
.field-label{ display:block; font-size:.76rem; color:var(--ink-soft); margin-bottom:5px; }
input[type=text],input[type=search],input[type=date],input[type=number],
input[type=file],textarea,select{
  width:100%; padding:8px 10px; background:var(--bg);
  border:1px solid var(--line); border-radius:9px; outline:none;
  transition:border-color .18s, box-shadow .18s;
}
textarea{ resize:vertical; min-height:70px; font-family:inherit; }
input:focus-visible,textarea:focus-visible,select:focus-visible{
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;
}
input[type=radio],input[type=checkbox]{ accent-color:var(--accent); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.checkrow{ display:flex; gap:16px; flex-wrap:wrap; font-size:.9rem; align-items:center; }
.checkrow label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
.checkrow input{ width:auto; }
.form-actions{ display:flex; gap:8px; flex-wrap:wrap; }

.btn{
  padding:8px 15px; border-radius:9px; cursor:pointer; font-size:.9rem;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:background .18s, border-color .18s, opacity .18s; white-space:nowrap;
}
.btn:hover{ background:var(--bg-soft); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
:root[data-theme="dark"] .btn.primary{ color:#151816; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{ color:#151816; } }
.btn.primary:hover{ opacity:.9; background:var(--accent); }
.btn.ghost{ background:none; }
.btn.danger{ color:var(--danger); border-color:var(--danger); background:none; }
.btn.small{ padding:4px 10px; font-size:.8rem; }

.segmented{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.segmented button{
  background:none; border:0; padding:6px 12px; cursor:pointer;
  color:var(--ink-soft); font-size:.84rem;
}
.segmented button + button{ border-left:1px solid var(--line); }
.segmented button.is-on{ background:var(--accent-soft); color:var(--ink); }
.segmented select{ border:0; border-radius:0; border-left:1px solid var(--line); width:auto; background:none; }

.quickadd{ display:flex; gap:8px; margin-bottom:16px; }
.quickadd input{ flex:1; }
.toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.toolbar input[type=text],.toolbar input[type=search]{ flex:1; min-width:160px; }
.toolbar .toggle{ flex:none; }
.toggle{ font-size:.8rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; cursor:pointer; }
.toggle input{ width:auto; }

.daypicker{ display:flex; gap:6px; flex-wrap:wrap; }
.daypicker button{
  width:38px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-soft); cursor:pointer; font-size:.78rem;
}
.daypicker button.is-on{ background:var(--accent-soft); border-color:var(--accent); color:var(--ink); }
.swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.swatch{
  width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  box-shadow:inset 0 0 0 2px var(--surface);
}
.swatch.is-on{ border-color:var(--ink-soft); }

/* ── filas genéricas ── */
.rows{ list-style:none; margin:0; padding:0; }
.rows > li{
  display:flex; align-items:center; gap:12px;
  padding:11px 0; border-top:1px solid var(--line-soft);
}
.rows > li:first-child{ border-top:0; }
.rows.tight > li{ padding:7px 0; }
.row.is-archived{ opacity:.5; }
.row-body{ flex:1; min-width:0; }
.row-title{ display:block; }
.row.is-done .row-title{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }
.row-meta{ display:flex; flex-wrap:wrap; gap:5px; margin-top:3px; }
.row-actions{ display:flex; gap:4px; flex:none; flex-wrap:wrap; }
.row-actions button{
  background:none; border:1px solid var(--line); border-radius:7px;
  padding:3px 9px; font-size:.74rem; color:var(--ink-soft); cursor:pointer;
}
.row-actions button:hover{ background:var(--bg-soft); color:var(--ink); }
.row-actions button.del:hover{ color:var(--danger); border-color:var(--danger); }

.chip{
  font-size:.71rem; padding:1px 8px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-soft);
}
.chip.is-quiet{ border-color:transparent; background:var(--bg-soft); color:var(--ink-faint); }
.chip.is-late{ border-color:var(--danger); color:var(--danger); }
.chip.is-soon{ border-color:var(--accent); color:var(--accent); }
.chip.is-link{ border-color:transparent; background:var(--accent-soft); color:var(--ink-soft); }

.box{
  width:20px; height:20px; flex:none; border-radius:5px; cursor:pointer;
  border:2px solid var(--hue, var(--ink-faint)); background:none;
  display:grid; place-items:center; padding:0;
  transition:background .18s, transform .18s;
}
.box.is-round{ border-radius:50%; }
.box::after{
  content:""; width:8px; height:8px; border-radius:2px;
  background:var(--surface); transform:scale(0); transition:transform .18s;
}
.box.is-round::after{ border-radius:50%; }
.is-done > .box, .box[aria-pressed="true"]{ background:var(--hue, var(--accent)); border-color:var(--hue, var(--accent)); }
.is-done > .box::after, .box[aria-pressed="true"]::after{ transform:scale(1); }
.box:active{ transform:scale(.9); }

.flame{
  font-size:.72rem; color:var(--ink-faint); border:1px solid var(--line);
  border-radius:999px; padding:1px 8px; flex:none; font-variant-numeric:tabular-nums;
}
.hue-dot{ width:11px; height:11px; border-radius:50%; flex:none; }
.amount{ font-variant-numeric:tabular-nums; font-size:.92rem; flex:none; }
.is-pos{ color:var(--pos); }
.is-neg{ color:var(--neg); }
.done-fold{ margin-top:12px; border-top:1px solid var(--line-soft); padding-top:10px; }
.done-fold summary{ cursor:pointer; font-size:.82rem; color:var(--ink-faint); }

/* ── Hoy ── */
.daybar{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.daybar-label{ flex:1; text-align:center; }
.daybar-label h2{ font-size:1.3rem; }
.step{
  width:36px; height:36px; flex:none; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:background .18s;
}
.step:hover:not(:disabled){ background:var(--accent-soft); color:var(--ink); }
.step:disabled{ opacity:.3; cursor:default; }

.moods{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.mood{
  flex:1; min-width:76px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); padding:9px 6px; cursor:pointer; text-align:center;
  transition:border-color .18s, background .18s;
}
.mood:hover{ background:var(--bg-soft); }
.mood .face{ display:flex; align-items:flex-end; justify-content:center; height:22px; margin-bottom:4px; }
.mood .face i{ width:11px; border-radius:2px 2px 0 0; background:var(--ink-faint); min-height:3px; }
.mood .label{ display:block; font-size:.7rem; color:var(--ink-faint); }
.mood.is-on{ border-color:var(--accent); background:var(--accent-soft); }
.mood.is-on .face i{ background:var(--accent); }
.saved{ font-size:.75rem; color:var(--accent); min-height:1.2em; margin-top:4px; }

/* ── Eisenhower ── */
.matrix{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.quad{ border:1px solid var(--line-soft); border-radius:10px; padding:12px; background:var(--bg); }
.quad-do{ border-color:var(--danger); }
.quad-plan{ border-color:var(--accent); }
.quad-head{ margin-bottom:8px; }
.quad-head strong{ display:block; font-size:.92rem; }
.quad-head span{ font-size:.72rem; color:var(--ink-faint); }

/* ── tablero ── */
.board{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.col{ background:var(--bg); border:1px solid var(--line-soft); border-radius:10px; padding:10px; min-height:120px; }
.col.over{ border-color:var(--accent); background:var(--accent-soft); }
.col-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font-size:.88rem; }
.col-list{ display:flex; flex-direction:column; gap:8px; }
.tcard{
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:9px 10px; cursor:grab;
}
.tcard.dragging{ opacity:.4; }
.tcard.is-done .tcard-title{ color:var(--ink-soft); text-decoration:line-through; }
.tcard-title{ font-size:.9rem; }
.tcard-meta{ display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
.tcard-move{ display:flex; gap:4px; margin-top:7px; flex-wrap:wrap; }
.tcard-move button{
  background:none; border:1px solid var(--line); border-radius:6px;
  padding:2px 7px; font-size:.68rem; color:var(--ink-faint); cursor:pointer;
}
.tcard-move button:hover{ color:var(--ink); background:var(--bg-soft); }

/* ── metas ── */
.goal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
.goal{ border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; background:var(--bg); }
.goal.is-archived{ opacity:.55; }
.goal-photo{ width:100%; height:130px; object-fit:cover; display:block; }
.goal-body{ padding:12px; }
.goal-body h4{ font-size:1rem; margin-bottom:4px; }
.goal-why{ font-size:.8rem; color:var(--ink-soft); margin-bottom:10px; }
.goal-progress{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.goal-track{ flex:1; height:7px; background:var(--bg-soft); border-radius:99px; overflow:hidden; }
.goal-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .3s; }
.goal-progress strong{ font-size:.82rem; font-variant-numeric:tabular-nums; }
.goal .row-actions{ margin-top:10px; }
.photo-field{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.photo-preview{ position:relative; width:110px; height:74px; border:1px dashed var(--line); border-radius:8px; display:grid; place-items:center; overflow:hidden; flex:none; }
.photo-preview img{ width:100%; height:100%; object-fit:cover; }
.photo-clear{
  position:absolute; right:4px; bottom:4px; font-size:.66rem; padding:1px 6px;
  border-radius:5px; border:0; background:rgba(0,0,0,.6); color:#fff; cursor:pointer;
}
.photo-field input[type=file]{ flex:1; min-width:150px; }

/* ── notas ── */
.note-split{ display:grid; grid-template-columns:210px 1fr; gap:16px; align-items:start; }
.note-list{ display:flex; flex-direction:column; gap:4px; max-height:520px; overflow:auto; }
.note-item{
  text-align:left; background:none; border:1px solid transparent; border-radius:8px;
  padding:7px 9px; cursor:pointer; color:inherit;
}
.note-item:hover{ background:var(--bg-soft); }
.note-item.is-on{ background:var(--accent-soft); border-color:var(--accent); }
.note-item strong{ display:block; font-size:.88rem; font-weight:500; }
.note-item span{ display:block; font-size:.7rem; color:var(--ink-faint); }
.note-pane{ min-width:0; }
.note-title{ font-family:var(--serif); font-size:1.15rem; margin-bottom:12px; }
.note-body{ font-family:var(--mono); font-size:.85rem; min-height:210px; }
.note-sub{ font-size:.8rem; color:var(--ink-soft); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
.note-render{ border:1px solid var(--line-soft); border-radius:9px; padding:12px; background:var(--bg); }
.note-p{ margin:0 0 4px; }
.note-h{ font-size:.98rem; margin:10px 0 4px; }
.note-gap{ height:8px; }
.note-check{ display:flex; align-items:center; gap:9px; padding:2px 0; }
.note-check.is-done{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }
.wikilink{
  background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
  text-decoration:underline; text-underline-offset:2px; font:inherit;
}
.wikilink.is-missing{ color:var(--ink-faint); text-decoration-style:dashed; }
.backlinks{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
.graph{ width:100%; height:440px; display:block; border:1px solid var(--line-soft); border-radius:10px; background:var(--bg); touch-action:none; }
.graph-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:.76rem; color:var(--ink-soft); }
.legend-item{ display:flex; align-items:center; gap:6px; }
.legend-dot{ width:9px; height:9px; border-radius:50%; }

/* ── entrenos ── */
.set-block{ border-top:1px solid var(--line-soft); padding:12px 0; }
.set-block:first-child{ border-top:0; }
.set-block-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
.set-list{ list-style:none; margin:0 0 8px; padding:0; display:flex; flex-direction:column; gap:6px; }
.set-list li{ display:flex; align-items:center; gap:7px; }
.set-list input{ width:74px; text-align:center; }
.set-n{ width:20px; font-size:.74rem; color:var(--ink-faint); }
.set-x,.set-unit{ font-size:.78rem; color:var(--ink-faint); }
.set-list .del{
  background:none; border:1px solid var(--line); border-radius:6px;
  width:26px; height:26px; color:var(--ink-faint); cursor:pointer; line-height:1;
}
.set-list .del:hover{ color:var(--danger); border-color:var(--danger); }
.table-wrap{ overflow-x:auto; }
.table{ width:100%; border-collapse:collapse; font-size:.86rem; }
.table th,.table td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
.table th{ font-size:.72rem; color:var(--ink-faint); font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
.table td{ font-variant-numeric:tabular-nums; }

/* ── estudio ── */
.pomo{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.pomo-ring{
  --p:0;
  width:132px; height:132px; flex:none; border-radius:50%;
  display:grid; place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 360deg), var(--bg-soft) 0);
}
.pomo-ring[data-phase="short"],.pomo-ring[data-phase="long"]{
  background:conic-gradient(var(--ink-faint) calc(var(--p) * 360deg), var(--bg-soft) 0);
}
.pomo-ring::after{
  content:""; position:absolute; width:112px; height:112px; border-radius:50%;
  background:var(--surface);
}
.pomo-ring{ position:relative; }
.pomo-clock{
  position:relative; z-index:1; font-family:var(--serif); font-size:1.9rem;
  font-variant-numeric:tabular-nums;
}
.pomo-side{ flex:1; min-width:230px; display:flex; flex-direction:column; gap:12px; }
.pomo-phase{ font-size:.86rem; color:var(--ink-soft); }
.subject{ border-top:1px solid var(--line-soft); padding:10px 0; }
.subject summary{ cursor:pointer; display:flex; align-items:center; gap:9px; }
.subject summary strong{ font-weight:500; }
.subject summary .count{ margin-left:auto; }
.subject-body{ padding:10px 0 0 20px; }

/* ── gráficos ── */
.viz-host{ position:relative; }
.viz-svg{ width:100%; height:auto; display:block; overflow:visible; }
.viz-grid{ stroke:var(--line-soft); stroke-width:1; }
.viz-axis{ fill:var(--ink-faint); font-size:10px; font-family:var(--sans); }
.viz-label{ fill:var(--ink-soft); font-size:10px; font-family:var(--sans); font-variant-numeric:tabular-nums; }
.viz-line{ fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.viz-area{ opacity:.12; }
.viz-dot{ stroke:var(--surface); stroke-width:2; }
.viz-cross{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; }
.viz-tip{
  position:absolute; pointer-events:none; z-index:5;
  background:var(--ink); color:var(--bg); border-radius:7px;
  padding:6px 9px; font-size:.74rem; line-height:1.4; white-space:nowrap;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.6);
}
.viz-tip-head{ font-weight:600; }

.barlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
.barlist-head{ display:flex; align-items:center; gap:8px; font-size:.86rem; }
.barlist-swatch{ width:9px; height:9px; border-radius:2px; flex:none; }
.barlist-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.barlist-val{ font-variant-numeric:tabular-nums; color:var(--ink-soft); flex:none; }
.barlist-track{ height:7px; background:var(--bg-soft); border-radius:99px; overflow:hidden; margin-top:4px; }
.barlist-fill{ height:100%; border-radius:99px; }
.barlist-sub{ font-size:.71rem; color:var(--ink-faint); margin-top:3px; }

.columns{ display:flex; align-items:flex-end; gap:4px; height:120px; }
.column{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
.column-bar{ background:var(--accent-soft); border-radius:3px 3px 0 0; min-height:2px; }
.column-bar.is-zero{ background:var(--line-soft); }
.column-label{ font-size:.62rem; color:var(--ink-faint); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── reflejo ── */
.stats{ display:flex; gap:10px; flex-wrap:wrap; }
.stat{ flex:1; min-width:104px; padding:12px; background:var(--bg); border:1px solid var(--line-soft); border-radius:10px; }
.stat b{ display:block; font-family:var(--serif); font-size:1.35rem; font-weight:600; font-variant-numeric:tabular-nums; }
.stat span{ font-size:.71rem; color:var(--ink-faint); }

.gridrow{ margin-bottom:18px; }
.gridrow-head{ display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:.86rem; }
.gridrow-head .pct{ margin-left:auto; font-size:.73rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.gridrow-foot{ font-size:.62rem; color:var(--ink-faint); margin-top:6px; }
.heatmap{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
.daylabels{ display:grid; grid-template-rows:repeat(7,15px); gap:3px; font-size:.6rem; line-height:15px; color:var(--ink-faint); flex:none; }
.cells{ display:grid; grid-template-rows:repeat(7,15px); grid-auto-flow:column; grid-auto-columns:15px; gap:3px; flex:none; }
.cell{ border-radius:3px; background:var(--bg-soft); }
.cell.off{ background:transparent; box-shadow:inset 0 0 0 1px var(--line-soft); }
.cell.future{ opacity:.3; }

.moodchart{ display:flex; align-items:flex-end; gap:3px; height:72px; margin-bottom:10px; }
.moodchart .bar{ flex:1; background:var(--accent-soft); border-radius:3px 3px 0 0; min-height:3px; }
.moodchart .bar.on{ background:var(--accent); }

.entries{ list-style:none; margin:0; padding:0; }
.entries li{ padding:13px 0; border-top:1px solid var(--line-soft); }
.entries li:first-child{ border-top:0; }
.entry-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.entry-date{ font-size:.79rem; color:var(--ink-soft); font-family:var(--serif); }
.entry-mood{ display:inline-flex; align-items:flex-end; height:13px; width:8px; flex:none; }
.entry-mood i{ width:100%; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; }
.entry-tally{ margin-left:auto; font-size:.71rem; color:var(--ink-faint); }
.entry-text{ white-space:pre-wrap; font-size:.93rem; }

/* ── diálogo y avisos ── */
dialog{
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); color:var(--ink); padding:0;
  max-width:460px; width:calc(100% - 32px); box-shadow:var(--shadow);
}
dialog::backdrop{ background:rgba(20,22,20,.45); backdrop-filter:blur(2px); }
.dialog-inner{ padding:22px; }
.dialog-inner h3{ margin-bottom:8px; }
.dialog-inner > * + *{ margin-top:12px; }
.dialog-actions{ display:flex; flex-direction:column; gap:8px; }
.dialog-msg{ font-size:.78rem; color:var(--accent); min-height:1.2em; }
.dialog-msg.is-error{ color:var(--danger); }
.dialog-close{ text-align:right; }
.copy-box{ font-family:var(--mono); font-size:.72rem; white-space:pre; }
#copyDialog{ max-width:560px; }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,14px);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px;
  font-size:.83rem; z-index:60; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; max-width:calc(100% - 32px); text-align:center;
}
.toast.is-on{ opacity:1; transform:translate(-50%,0); }
.toast.is-error{ background:var(--danger); color:#fff; }

/* ── bienvenida y datos de ejemplo ── */
.demo-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:9px 14px; margin-bottom:16px;
  background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:10px; font-size:.82rem; color:var(--ink-soft);
}
.linkish{
  background:none; border:0; padding:0; cursor:pointer; font:inherit;
  color:var(--accent); text-decoration:underline; text-underline-offset:2px;
}
.welcome{ max-width:640px; margin-inline:auto; }
.welcome h2{ font-size:1.5rem; margin-bottom:8px; }
.welcome-lead{ color:var(--ink-soft); margin-bottom:20px; }
.welcome-list{
  list-style:none; margin:0 0 22px; padding:0;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:2px 20px;
}
.welcome-list li{
  display:flex; gap:9px; align-items:baseline;
  padding:7px 0; border-top:1px solid var(--line-soft);
}
.welcome-list strong{ font-weight:500; flex:none; min-width:78px; }
.welcome-list span{ font-size:.82rem; color:var(--ink-faint); }
.welcome .form-actions{ margin-bottom:12px; }

.foot{ max-width:1000px; margin:0 auto; padding:0 20px 40px; font-size:.73rem; color:var(--ink-faint); text-align:center; }

/* ── estrecho ── */
@media (max-width:820px){
  .note-split{ grid-template-columns:1fr; }
  .note-list{ max-height:180px; flex-direction:row; overflow-x:auto; }
  .note-item{ min-width:150px; flex:none; }
  .board{ grid-template-columns:1fr; }
}
@media (max-width:560px){
  .top-inner{ padding:13px 16px 6px; }
  main{ padding:18px 16px 50px; }
  .card{ padding:16px; }
  .grid-2,.grid-3,.matrix{ grid-template-columns:1fr; }
  .row-actions button{ padding:3px 7px; }
  .pomo{ justify-content:center; }
}

</style>

<script>
/* ─── qp/core.js ─── */
/* Quiet Process — núcleo compartido: estado, fechas, DOM, router y gráficos.
   Script clásico (no módulo ES) para que la app siga abriéndose con doble
   clic desde file:// sin servidor ni build. */
var QP = (function () {
  "use strict";

  var KEY = "quiet-process.v2";
  var LEGACY_KEY = "quiet-process.v1";
  var THEME_KEY = "quiet-process.theme";

  var DAY_SHORT = ["D", "L", "M", "X", "J", "V", "S"];
  var DAY_LONG = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var MONTHS_SHORT = ["ene", "feb", "mar", "abr", "may", "jun",
    "jul", "ago", "sep", "oct", "nov", "dic"];

  /* Paleta categórica validada con el validador de dataviz: orden fijo, nunca
     ciclado. Los pares adyacentes superan los umbrales de daltonismo y de
     visión normal en claro y en oscuro. */
  var SERIES_LIGHT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
  var SERIES_DARK = ["#3987e5", "#d95926", "#199e70", "#c98500",
    "#d55181", "#008300", "#9085e9", "#e66767"];

  /* Colores de identidad (hábitos, metas, asignaturas). Deliberadamente
     apagados: no son una escala de gráfico y nunca cargan el significado
     solos — siempre acompañan al nombre escrito. */
  var HUES = ["#6f8a75", "#7a8496", "#8a7f6f", "#96757f", "#87906a", "#6f8a8a"];

  /* ── fechas: siempre hora local, clave YYYY-MM-DD ─────────────────────── */
  function key(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function parseKey(s) {
    var p = String(s).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function today() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function addDays(d, n) {
    var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    c.setDate(c.getDate() + n);
    return c;
  }
  function addMonths(d, n) {
    var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = c.getDate();
    c.setDate(1);
    c.setMonth(c.getMonth() + n);
    // Si el día no existe en el mes destino (31 → febrero), cae al último.
    c.setDate(Math.min(day, new Date(c.getFullYear(), c.getMonth() + 1, 0).getDate()));
    return c;
  }
  function longDate(d) {
    return DAY_LONG[d.getDay()] + " " + d.getDate() + " de " +
      MONTHS[d.getMonth()] + " de " + d.getFullYear();
  }
  function shortDate(d) { return d.getDate() + " " + MONTHS_SHORT[d.getMonth()]; }
  function monthKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(mk) {
    var p = mk.split("-");
    return MONTHS[+p[1] - 1] + " " + p[0];
  }
  function relativeDay(d) {
    var diff = Math.round((d - today()) / 86400000);
    if (diff === 0) return "Hoy";
    if (diff === -1) return "Ayer";
    if (diff === 1) return "Mañana";
    return shortDate(d);
  }
  function dueLabel(dateKey) {
    if (!dateKey) return null;
    var d = parseKey(dateKey);
    var diff = Math.round((d - today()) / 86400000);
    if (diff < 0) return { text: diff === -1 ? "ayer" : "hace " + (-diff) + " días", late: true };
    if (diff === 0) return { text: "hoy", soon: true };
    if (diff === 1) return { text: "mañana", soon: true };
    if (diff <= 7) return { text: "en " + diff + " días" };
    return { text: shortDate(d) };
  }

  /* ── utilidades ───────────────────────────────────────────────────────── */
  function uid(p) {
    return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function sum(arr, f) {
    return arr.reduce(function (a, x) { return a + (f ? f(x) : x); }, 0);
  }
  function groupBy(arr, f) {
    var out = {};
    arr.forEach(function (x) {
      var k = f(x);
      (out[k] = out[k] || []).push(x);
    });
    return out;
  }
  function byId(arr, id) {
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }
  function slug(s) {
    return String(s).trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  /* Dinero en céntimos enteros: nada de sumar floats. */
  function money(cents, opts) {
    var o = opts || {};
    var v = (cents || 0) / 100;
    var s;
    try {
      s = v.toLocaleString(db.settings.locale || "es-ES", {
        style: "currency", currency: db.settings.currency || "EUR",
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });
    } catch (e) {
      s = v.toFixed(2) + " " + (db.settings.currency || "EUR");
    }
    if (o.sign && cents > 0) s = "+" + s;
    return s;
  }
  function parseMoney(str) {
    var s = String(str).trim().replace(/[^\d,.\-]/g, "");
    if (!s) return NaN;
    // El último separador manda: "1.234,56" y "1,234.56" salen igual.
    var lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
    if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
    var n = parseFloat(s);
    return isNaN(n) ? NaN : Math.round(n * 100);
  }

  /* ── DOM ──────────────────────────────────────────────────────────────── */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  /* Vaciar un nodo puede disparar un blur en el hijo que se quita, y ese blur
     puede volver a redibujar la misma zona. Si eso pasa, el nodo ya no es hijo
     nuestro: se corta en seco en vez de lanzar. */
  function clear(node) {
    if (!node) return;
    while (node.firstChild) {
      var c = node.firstChild;
      if (c.parentNode !== node) break;
      node.removeChild(c);
    }
  }
  function on(node, ev, fn) { node.addEventListener(ev, fn); return node; }
  function svg(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  }
  function btn(cls, text, fn) {
    var b = el("button", cls, text);
    b.type = "button";
    if (fn) b.addEventListener("click", fn);
    return b;
  }
  function field(labelText, control) {
    var l = el("label", "field");
    l.appendChild(el("span", "field-label", labelText));
    l.appendChild(control);
    return l;
  }
  function input(type, attrs) {
    var i = document.createElement(type === "textarea" ? "textarea" : "input");
    if (type !== "textarea") i.type = type;
    for (var k in attrs) if (attrs[k] != null) i.setAttribute(k, attrs[k]);
    return i;
  }
  function select(options, value) {
    var s = document.createElement("select");
    options.forEach(function (o) {
      var op = el("option", null, o.label);
      op.value = o.value;
      if (String(o.value) === String(value)) op.selected = true;
      s.appendChild(op);
    });
    return s;
  }

  /* ── estado ───────────────────────────────────────────────────────────── */
  function blank() {
    return {
      version: 2,
      createdAt: key(today()),
      settings: {
        currency: "EUR", locale: "es-ES",
        pomo: { work: 25, short: 5, long: 15, rounds: 4 }
      },
      habits: [], log: {}, tasks: [], goals: [], notes: [],
      exercises: [], workouts: [],
      tx: [], categories: ["Casa", "Comida", "Transporte", "Salud", "Ocio", "Trabajo"],
      subjects: [], sessions: []
    };
  }

  /* Rellena huecos sin pisar lo que ya existe: sirve tanto para datos viejos
     como para archivos importados a los que les falte una sección. */
  function normalize(d) {
    var base = blank();
    if (!d || typeof d !== "object") return base;
    ["habits", "tasks", "goals", "notes", "exercises", "workouts", "tx",
      "categories", "subjects", "sessions"].forEach(function (k) {
      if (!Array.isArray(d[k])) d[k] = base[k];
    });
    if (!d.log || typeof d.log !== "object") d.log = {};
    if (!d.settings || typeof d.settings !== "object") d.settings = base.settings;
    if (!d.settings.pomo) d.settings.pomo = base.settings.pomo;
    if (!d.settings.currency) d.settings.currency = "EUR";
    if (!d.settings.locale) d.settings.locale = "es-ES";
    if (!d.createdAt) d.createdAt = key(today());
    d.demo = !!d.demo;
    d.version = 2;
    return d;
  }

  function migrateV1(old) {
    var d = blank();
    d.habits = Array.isArray(old.habits) ? old.habits : [];
    d.log = (old.log && typeof old.log === "object") ? old.log : {};
    d.createdAt = old.createdAt || key(today());
    return d;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
      var legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        var v1 = JSON.parse(legacy);
        if (v1 && Array.isArray(v1.habits)) {
          var moved = migrateV1(v1);
          localStorage.setItem(KEY, JSON.stringify(moved));
          return moved;
        }
      }
    } catch (e) { /* datos ilegibles: se empieza limpio */ }
    return blank();
  }

  var db = load();
  var saveTimer = null;
  var listeners = [];

  function save(now) {
    clearTimeout(saveTimer);
    var write = function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(db));
      } catch (e) {
        toast("No se pudo guardar: almacenamiento lleno o bloqueado.", true);
      }
    };
    if (now) write(); else saveTimer = setTimeout(write, 200);
    listeners.forEach(function (f) { f(); });
  }
  function onChange(fn) { listeners.push(fn); }

  /* ── avisos ───────────────────────────────────────────────────────────── */
  var toastTimer = null;
  function toast(text, isError) {
    var box = $("#toast");
    if (!box) return;
    box.textContent = text;
    box.className = "toast is-on" + (isError ? " is-error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      box.className = "toast";
      // Se vacía además de ocultarse: es un aria-live, y dejar el texto viejo
      // dentro es dejarlo al alcance de un lector de pantalla.
      box.textContent = "";
    }, 3200);
  }

  /* ── router ───────────────────────────────────────────────────────────── */
  var views = {};
  var current = null;
  function view(name, render) { views[name] = render; }
  function show(name) {
    if (!views[name]) name = "today";
    current = name;
    $$(".tab").forEach(function (t) {
      t.classList.toggle("is-active", t.dataset.view === name);
      t.setAttribute("aria-selected", String(t.dataset.view === name));
    });
    $$(".view").forEach(function (v) {
      var active = v.id === "view-" + name;
      v.classList.toggle("is-active", active);
      // Las vistas ocultas se vacían: si no, arrastran DOM viejo (un aviso ya
      // retirado, un canvas del grafo, una lista de mil filas) que sólo se
      // rehace al volver a entrar.
      if (!active) clear(v);
    });
    try { localStorage.setItem("quiet-process.tab", name); } catch (e) { /* privado */ }
    views[name]();
    // El aviso de datos de ejemplo va en todas las vistas, no sólo en Hoy.
    if (name !== "today" && QP.demo) {
      var bar = QP.demo.banner();
      var host = $("#view-" + name);
      if (bar && host) host.insertBefore(bar, host.firstChild);
    }
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  function refresh() { if (current && views[current]) views[current](); }

  /* ── tema ─────────────────────────────────────────────────────────────── */
  function isDark() {
    var forced = document.documentElement.getAttribute("data-theme");
    if (forced) return forced === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function series(i) {
    var pal = isDark() ? SERIES_DARK : SERIES_LIGHT;
    return pal[i % pal.length];
  }

  /* ── gráficos ─────────────────────────────────────────────────────────────
     SVG a mano, sin librería. Marcas finas, un solo eje, rejilla discreta y
     capa de hover con tooltip — nunca dos escalas Y en el mismo gráfico. */

  function tooltipLayer(host) {
    var tip = el("div", "viz-tip");
    tip.hidden = true;
    host.appendChild(tip);
    return {
      show: function (html, x, y) {
        tip.textContent = "";
        html.forEach(function (line, i) {
          var p = el("div", i === 0 ? "viz-tip-head" : null, line);
          tip.appendChild(p);
        });
        tip.hidden = false;
        var w = host.clientWidth;
        tip.style.left = clamp(x, 4, Math.max(4, w - tip.offsetWidth - 4)) + "px";
        tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + "px";
      },
      hide: function () { tip.hidden = true; }
    };
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / mag;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  /* Gráfico de línea de una sola serie: evolución en el tiempo.
     points: [{ label, value, sub }] en orden cronológico. */
  function lineChart(host, points, opts) {
    var o = opts || {};
    clear(host);
    host.classList.add("viz");
    if (points.length < 2) {
      host.appendChild(el("p", "empty", o.emptyText || "Hacen falta al menos dos registros para dibujar la evolución."));
      return;
    }
    var W = 640, H = 180, padL = 46, padR = 12, padT = 12, padB = 26;
    var vals = points.map(function (p) { return p.value; });
    var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
    var max, min;
    if (o.zero === false) {
      // Rango ajustado con un margen del 12 % arriba y abajo, para que la
      // línea no se pegue a los bordes del panel.
      var pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1;
      min = lo - pad; max = hi + pad;
    } else {
      min = 0; max = niceMax(hi);
    }
    if (min === max) max = min + 1;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var X = function (i) { return padL + (points.length === 1 ? innerW / 2 : innerW * i / (points.length - 1)); };
    var Y = function (v) { return padT + innerH - innerH * (v - min) / (max - min); };

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, class: "viz-svg", role: "img" });
    s.appendChild(svg("title", {})).textContent = o.title || "Evolución";

    [0, 0.5, 1].forEach(function (f) {
      var v = min + (max - min) * f;
      s.appendChild(svg("line", { x1: padL, x2: W - padR, y1: Y(v), y2: Y(v), class: "viz-grid" }));
      var t = svg("text", { x: padL - 8, y: Y(v) + 4, class: "viz-axis", "text-anchor": "end" });
      t.textContent = o.fmt ? o.fmt(v) : Math.round(v);
      s.appendChild(t);
    });

    var d = points.map(function (p, i) { return (i ? "L" : "M") + X(i) + " " + Y(p.value); }).join(" ");
    if (o.area !== false) {
      s.appendChild(svg("path", {
        d: d + " L" + X(points.length - 1) + " " + Y(min) + " L" + X(0) + " " + Y(min) + " Z",
        class: "viz-area", fill: o.color || series(0)
      }));
    }
    s.appendChild(svg("path", { d: d, class: "viz-line", stroke: o.color || series(0) }));

    points.forEach(function (p, i) {
      s.appendChild(svg("circle", {
        cx: X(i), cy: Y(p.value), r: 4, class: "viz-dot", fill: o.color || series(0)
      }));
    });

    // Etiquetas selectivas: primera, última y el máximo. Nunca todas.
    var maxI = vals.indexOf(Math.max.apply(null, vals));
    [0, points.length - 1, maxI].filter(function (v, i, a) { return a.indexOf(v) === i; })
      .forEach(function (i) {
        var t = svg("text", {
          x: clamp(X(i), padL + 14, W - padR - 14), y: Y(points[i].value) - 10,
          class: "viz-label", "text-anchor": "middle"
        });
        t.textContent = o.fmt ? o.fmt(points[i].value) : points[i].value;
        s.appendChild(t);
      });

    [0, points.length - 1].forEach(function (i) {
      var t = svg("text", {
        x: clamp(X(i), padL, W - padR), y: H - 8, class: "viz-axis",
        "text-anchor": i === 0 ? "start" : "end"
      });
      t.textContent = points[i].label;
      s.appendChild(t);
    });

    var cross = svg("line", { class: "viz-cross", y1: padT, y2: padT + innerH, x1: 0, x2: 0 });
    cross.style.opacity = 0;
    s.appendChild(cross);
    host.appendChild(s);

    var tip = tooltipLayer(host);
    on(s, "pointermove", function (ev) {
      var r = s.getBoundingClientRect();
      var px = (ev.clientX - r.left) / r.width * W;
      var i = clamp(Math.round((px - padL) / (innerW / (points.length - 1))), 0, points.length - 1);
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
      cross.style.opacity = 1;
      var p = points[i];
      tip.show([p.label, (o.fmt ? o.fmt(p.value) : String(p.value)) + (p.sub ? " · " + p.sub : "")],
        (X(i) / W) * r.width, (Y(p.value) / H) * r.height);
    });
    on(s, "pointerleave", function () { cross.style.opacity = 0; tip.hide(); });
  }

  /* Barras horizontales con etiqueta directa: comparación de magnitud entre
     categorías. La etiqueta visible cumple la regla de relieve para los tonos
     que quedan por debajo de 3:1 sobre fondo claro. */
  function barList(host, rows, opts) {
    var o = opts || {};
    clear(host);
    if (!rows.length) {
      host.appendChild(el("p", "empty", o.emptyText || "Sin datos todavía."));
      return;
    }
    var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.value); })) || 1;
    var list = el("ul", "barlist");
    rows.forEach(function (r, i) {
      var li = el("li");
      var head = el("div", "barlist-head");
      var sw = el("span", "barlist-swatch");
      sw.style.background = r.color || series(i);
      head.appendChild(sw);
      head.appendChild(el("span", "barlist-name", r.label));
      head.appendChild(el("span", "barlist-val", o.fmt ? o.fmt(r.value) : String(r.value)));
      li.appendChild(head);
      var track = el("div", "barlist-track");
      var fill = el("div", "barlist-fill");
      fill.style.width = (Math.abs(r.value) / max * 100) + "%";
      fill.style.background = r.color || series(i);
      track.appendChild(fill);
      li.appendChild(track);
      if (r.sub) li.appendChild(el("p", "barlist-sub", r.sub));
      list.appendChild(li);
    });
    host.appendChild(list);
  }

  /* Barras verticales para una serie temporal corta (meses, días). */
  function columns(host, points, opts) {
    var o = opts || {};
    clear(host);
    if (!points.length) {
      host.appendChild(el("p", "empty", o.emptyText || "Sin datos todavía."));
      return;
    }
    var max = Math.max.apply(null, points.map(function (p) { return p.value; })) || 1;
    var wrap = el("div", "columns");
    points.forEach(function (p) {
      var col = el("div", "column");
      var bar = el("div", "column-bar");
      bar.style.height = Math.max(2, p.value / max * 100) + "%";
      if (p.color) bar.style.background = p.color;
      if (!p.value) bar.classList.add("is-zero");
      bar.title = p.label + " — " + (o.fmt ? o.fmt(p.value) : p.value);
      col.appendChild(bar);
      col.appendChild(el("span", "column-label", p.short || p.label));
      wrap.appendChild(col);
    });
    host.appendChild(wrap);
  }

  /* ── CSV / OFX ────────────────────────────────────────────────────────── */
  /* Detecta el separador antes de partir: un CSV europeo usa ";" y deja la
     coma como decimal, así que tratar ambos como delimitador rompe "45,20". */
  function sniffDelimiter(text) {
    var head = text.slice(0, 4096).split(/\r?\n/).slice(0, 5).join("\n");
    var outside = head.replace(/"[^"]*"/g, "");
    var counts = [
      { d: ";", n: (outside.match(/;/g) || []).length },
      { d: "\t", n: (outside.match(/\t/g) || []).length },
      { d: ",", n: (outside.match(/,/g) || []).length }
    ].sort(function (a, b) { return b.n - a.n; });
    return counts[0].n ? counts[0].d : ",";
  }

  function parseCSV(text, delim) {
    var d = delim || sniffDelimiter(text);
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
  }

  function parseOFX(text) {
    var out = [];
    var blocks = text.split(/<STMTTRN>/i).slice(1);
    blocks.forEach(function (b) {
      var get = function (tag) {
        var m = b.match(new RegExp("<" + tag + ">([^<\\r\\n]*)", "i"));
        return m ? m[1].trim() : "";
      };
      var raw = get("DTPOSTED").slice(0, 8);
      if (raw.length !== 8) return;
      var amt = parseFloat(get("TRNAMT"));
      if (isNaN(amt)) return;
      out.push({
        date: raw.slice(0, 4) + "-" + raw.slice(4, 6) + "-" + raw.slice(6, 8),
        amount: Math.round(Math.abs(amt) * 100),
        kind: amt < 0 ? "out" : "in",
        note: get("MEMO") || get("NAME") || "Movimiento"
      });
    });
    return out;
  }

  /* ── guardar archivos ─────────────────────────────────────────────────────
     Hay tres mundos y la app corre en los tres:
       · archivo local o hosting normal → un <a download> basta;
       · dentro del visor de artifacts   → los enlaces de descarga son inertes,
         hay que pedirlo por la capacidad "downloads", que enseña al usuario
         una confirmación y puede decir que no;
       · visor sin esa capacidad         → no hay forma de entregar un archivo,
         así que se le enseña el contenido para que lo copie.
     Se sondea al cargar para que al pulsar ya esté resuelto. */
  var hosted = !!(typeof window !== "undefined" && window.claude &&
    typeof window.claude.use === "function");
  var saverPromise = null;

  function saver() {
    if (saverPromise) return saverPromise;
    saverPromise = new Promise(function (resolve) {
      if (!hosted) { resolve(null); return; }
      try {
        window.claude.use("downloads").then(
          function (d) { resolve(d || null); },
          function () { resolve(null); }
        );
      } catch (e) { resolve(null); }
    });
    return saverPromise;
  }
  if (hosted) saver();

  function anchorSave(name, text, mime) {
    var blob = new Blob([text], { type: mime || "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* Último recurso: el contenido a la vista, seleccionado, con botón de copiar. */
  function copyFallback(name, text) {
    var dlg = $("#copyDialog");
    if (!dlg) {
      dlg = el("dialog");
      dlg.id = "copyDialog";
      document.body.appendChild(dlg);
    }
    clear(dlg);
    var box = el("div", "dialog-inner");
    box.appendChild(el("h3", null, "Copia tus datos"));
    box.appendChild(el("p", "muted small",
      "Aquí no se pueden descargar archivos. Copia este texto y guárdalo como «" +
      name + "» — vale igual para reimportarlo luego."));
    var ta = input("textarea", { rows: 10, readonly: "readonly", spellcheck: "false" });
    ta.className = "copy-box";
    ta.value = text;
    box.appendChild(ta);
    var acts = el("div", "form-actions");
    acts.appendChild(btn("btn primary", "Copiar al portapapeles", function () {
      ta.select();
      var done = function () { toast("Copiado."); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {
          toast("No pude copiarlo. Selecciona el texto y usa Ctrl+C.", true);
        });
      } else {
        try { document.execCommand("copy"); done(); }
        catch (e) { toast("Selecciona el texto y usa Ctrl+C.", true); }
      }
    }));
    acts.appendChild(btn("btn ghost", "Cerrar", function () { dlg.close(); }));
    box.appendChild(acts);
    dlg.appendChild(box);
    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
    ta.focus();
    ta.select();
  }

  function download(name, text, mime) {
    saver().then(function (d) {
      if (!d) {
        // Fuera del visor el enlace funciona; dentro, no hay nada que hacer
        // salvo enseñar el texto.
        if (hosted) copyFallback(name, text);
        else anchorSave(name, text, mime);
        return;
      }
      d.save({ filename: name, data: text }).then(function () {
        toast("Guardado.");
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") return;                 // dijo que no: sin ruido
        if (code === "rate_limited") {
          toast("Hay otra descarga esperando respuesta. Inténtalo en un momento.", true);
          return;
        }
        if (code === "too_large") {
          toast("La copia es demasiado grande para descargarla aquí.", true);
          return;
        }
        copyFallback(name, text);
      });
    });
  }

  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onScheme = function () { refresh(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  } catch (e) { /* navegador sin matchMedia utilizable */ }

  return {
    KEY: KEY, THEME_KEY: THEME_KEY,
    DAY_SHORT: DAY_SHORT, DAY_LONG: DAY_LONG, MONTHS: MONTHS, MONTHS_SHORT: MONTHS_SHORT,
    HUES: HUES,
    get db() { return db; },
    set db(v) { db = normalize(v); },
    blank: blank, normalize: normalize, save: save, onChange: onChange,
    key: key, parseKey: parseKey, today: today, addDays: addDays, addMonths: addMonths,
    longDate: longDate, shortDate: shortDate, relativeDay: relativeDay, dueLabel: dueLabel,
    monthKey: monthKey, monthLabel: monthLabel,
    uid: uid, clamp: clamp, sum: sum, groupBy: groupBy, byId: byId, slug: slug,
    money: money, parseMoney: parseMoney,
    $: $, $$: $$, el: el, clear: clear, on: on, svg: svg, btn: btn,
    field: field, input: input, select: select,
    toast: toast, view: view, show: show, refresh: refresh,
    isDark: isDark, series: series,
    lineChart: lineChart, barList: barList, columns: columns,
    parseCSV: parseCSV, sniffDelimiter: sniffDelimiter, parseOFX: parseOFX,
    hosted: function () { return hosted; }, download: download
  };
})();


/* ─── qp/tasks.js ─── */
/* Tareas y hábitos: la lista de Hoy, la matriz de Eisenhower y el tablero. */
(function () {
  "use strict";
  var Q = QP;

  /* ── hábitos: cadencia, marcas y rachas ───────────────────────────────── */
  function scheduled(h, d) {
    if (h.cadence === "daily") return true;
    if (h.cadence === "weekdays") return d.getDay() >= 1 && d.getDay() <= 5;
    return (h.days || []).indexOf(d.getDay()) !== -1;
  }
  function habitDone(h, d) {
    var e = Q.db.log[Q.key(d)];
    return !!(e && e.habits && e.habits[h.id]);
  }
  function habitStart(h) {
    return Q.parseKey(h.createdAt || Q.db.createdAt);
  }
  /* Días programados consecutivos hacia atrás. Si hoy toca y aún no está
     marcado no rompe la racha: todavía no la suma. */
  function streak(h) {
    var d = Q.today();
    if (scheduled(h, d) && !habitDone(h, d)) d = Q.addDays(d, -1);
    var floor = habitStart(h), n = 0, guard = 0;
    while (d >= floor && guard++ < 3650) {
      if (scheduled(h, d)) {
        if (habitDone(h, d)) n++; else break;
      }
      d = Q.addDays(d, -1);
    }
    return n;
  }
  function rate(h, days) {
    var end = Q.today(), start = Q.addDays(end, -(days - 1)), floor = habitStart(h);
    if (start < floor) start = floor;
    var due = 0, hit = 0;
    for (var d = new Date(start); d <= end; d = Q.addDays(d, 1)) {
      if (!scheduled(h, d)) continue;
      due++;
      if (habitDone(h, d)) hit++;
    }
    return { due: due, hit: hit, pct: due ? Math.round(hit / due * 100) : 0 };
  }
  function activeHabits() {
    return Q.db.habits.filter(function (h) { return !h.archived; });
  }
  function habitsDueOn(d) {
    return activeHabits().filter(function (h) {
      return scheduled(h, d) && Q.parseKey(Q.key(d)) >= habitStart(h);
    });
  }
  function entry(k, make) {
    var e = Q.db.log[k];
    if (!e && make) { e = { habits: {}, mood: null, note: "" }; Q.db.log[k] = e; }
    if (e && !e.habits) e.habits = {};
    return e || null;
  }
  function pruneEntry(k) {
    var e = Q.db.log[k];
    if (!e) return;
    var any = Object.keys(e.habits || {}).some(function (id) { return e.habits[id]; });
    if (!any && !e.mood && !(e.note || "").trim()) delete Q.db.log[k];
  }
  function toggleHabit(id, d) {
    var k = Q.key(d), e = entry(k, true);
    if (e.habits[id]) delete e.habits[id]; else e.habits[id] = true;
    pruneEntry(k);
    Q.save();
  }

  /* ── tareas ───────────────────────────────────────────────────────────── */
  function openTasks() {
    return Q.db.tasks.filter(function (t) { return !t.done; });
  }
  function tasksDueOn(d) {
    var k = Q.key(d);
    return Q.db.tasks.filter(function (t) {
      if (t.done) return t.doneAt === k;      // hechas hoy: siguen visibles
      return t.due && t.due <= k;             // sin fecha = no invade el día
    });
  }
  function toggleTask(id) {
    var t = Q.byId(Q.db.tasks, id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Q.key(Q.today()) : null;
    if (t.done) t.status = "done";
    else if (t.status === "done") t.status = "todo";
    Q.save();
  }
  function addTask(fields) {
    var t = {
      id: Q.uid("t"), title: fields.title, note: fields.note || "",
      done: false, doneAt: null, due: fields.due || null,
      urgent: !!fields.urgent, important: !!fields.important,
      status: fields.status || "todo",
      goalId: fields.goalId || null, subjectId: fields.subjectId || null,
      order: Date.now(), createdAt: Q.key(Q.today())
    };
    Q.db.tasks.push(t);
    Q.save();
    return t;
  }

  /* ── piezas de interfaz reutilizables ─────────────────────────────────── */
  function goalOptions(sel) {
    return [{ value: "", label: "— sin meta —" }].concat(
      Q.db.goals.filter(function (g) { return !g.archived; }).map(function (g) {
        return { value: g.id, label: g.title };
      }));
  }
  function subjectOptions() {
    return [{ value: "", label: "— sin asignatura —" }].concat(
      Q.db.subjects.map(function (s) { return { value: s.id, label: s.name }; }));
  }

  function taskRow(t, opts) {
    var o = opts || {};
    var li = Q.el("li", "row" + (t.done ? " is-done" : ""));

    var box = Q.btn("box", null, function () { toggleTask(t.id); Q.refresh(); });
    box.setAttribute("aria-pressed", String(!!t.done));
    box.setAttribute("aria-label", (t.done ? "Desmarcar " : "Marcar ") + t.title);
    li.appendChild(box);

    var body = Q.el("div", "row-body");
    body.appendChild(Q.el("span", "row-title", t.title));
    var meta = Q.el("span", "row-meta");
    var due = Q.dueLabel(t.due);
    if (due) {
      var dd = Q.el("span", "chip" + (due.late ? " is-late" : due.soon ? " is-soon" : ""), due.text);
      meta.appendChild(dd);
    }
    if (t.urgent || t.important) {
      meta.appendChild(Q.el("span", "chip",
        t.urgent && t.important ? "urgente e importante" : t.urgent ? "urgente" : "importante"));
    }
    var g = t.goalId && Q.byId(Q.db.goals, t.goalId);
    if (g) meta.appendChild(Q.el("span", "chip is-link", "◎ " + g.title));
    var s = t.subjectId && Q.byId(Q.db.subjects, t.subjectId);
    if (s) meta.appendChild(Q.el("span", "chip is-link", "✎ " + s.name));
    if (t.note) meta.appendChild(Q.el("span", "chip is-quiet", t.note));
    if (meta.childNodes.length) body.appendChild(meta);
    li.appendChild(body);

    if (o.actions !== false) {
      var acts = Q.el("div", "row-actions");
      acts.appendChild(Q.btn(null, "editar", function () { editTask(t); }));
      acts.appendChild(Q.btn("del", "borrar", function () {
        if (!window.confirm("¿Borrar «" + t.title + "»?")) return;
        Q.db.tasks = Q.db.tasks.filter(function (x) { return x.id !== t.id; });
        Q.save(); Q.refresh();
      }));
      li.appendChild(acts);
    }
    return li;
  }

  function habitRow(h, d) {
    var isDone = habitDone(h, d);
    var li = Q.el("li", "row" + (isDone ? " is-done" : ""));

    var box = Q.btn("box is-round", null, function () { toggleHabit(h.id, d); Q.refresh(); });
    box.style.setProperty("--hue", h.color || Q.HUES[0]);
    box.setAttribute("aria-pressed", String(isDone));
    box.setAttribute("aria-label", (isDone ? "Desmarcar " : "Marcar ") + h.name);
    li.appendChild(box);

    var body = Q.el("div", "row-body");
    body.appendChild(Q.el("span", "row-title", h.name));
    var meta = Q.el("span", "row-meta");
    if (h.note) meta.appendChild(Q.el("span", "chip is-quiet", h.note));
    var g = h.goalId && Q.byId(Q.db.goals, h.goalId);
    if (g) meta.appendChild(Q.el("span", "chip is-link", "◎ " + g.title));
    if (meta.childNodes.length) body.appendChild(meta);
    li.appendChild(body);

    var n = streak(h);
    if (n > 0) {
      var flame = Q.el("span", "flame", "▲ " + n);
      flame.title = n + (n === 1 ? " día seguido" : " días seguidos");
      li.appendChild(flame);
    }
    return li;
  }

  /* ── editor de tareas (panel inline, no modal) ────────────────────────── */
  var editingTask = null;
  function editTask(t) {
    editingTask = t;
    Q.show("tasks");
    var host = Q.$("#taskFormHost");
    if (host) host.scrollIntoView({ block: "center" });
  }

  function taskForm(host) {
    Q.clear(host);
    var t = editingTask || {};
    var f = Q.el("form", "stack");

    var title = Q.input("text", { maxlength: 120, placeholder: "Llamar al banco", required: "required" });
    title.value = t.title || "";
    f.appendChild(Q.field("Tarea", title));

    var note = Q.input("text", { maxlength: 200, placeholder: "detalle opcional" });
    note.value = t.note || "";
    f.appendChild(Q.field("Nota", note));

    var grid = Q.el("div", "grid-2");
    var due = Q.input("date", {});
    due.value = t.due || "";
    grid.appendChild(Q.field("Para cuándo", due));
    var goal = Q.select(goalOptions(), t.goalId || "");
    grid.appendChild(Q.field("Meta", goal));
    f.appendChild(grid);

    var grid2 = Q.el("div", "grid-2");
    var subj = Q.select(subjectOptions(), t.subjectId || "");
    grid2.appendChild(Q.field("Asignatura", subj));
    var status = Q.select([
      { value: "todo", label: "Por hacer" },
      { value: "doing", label: "En marcha" },
      { value: "done", label: "Hecho" }
    ], t.status || "todo");
    grid2.appendChild(Q.field("Estado", status));
    f.appendChild(grid2);

    var flags = Q.el("div", "checkrow");
    var urgent = Q.input("checkbox", {}); urgent.checked = !!t.urgent;
    var important = Q.input("checkbox", {}); important.checked = !!t.important;
    var l1 = Q.el("label"); l1.appendChild(urgent); l1.appendChild(document.createTextNode(" Urgente"));
    var l2 = Q.el("label"); l2.appendChild(important); l2.appendChild(document.createTextNode(" Importante"));
    flags.appendChild(l1); flags.appendChild(l2);
    f.appendChild(Q.field("Prioridad", flags));

    var actions = Q.el("div", "form-actions");
    var submit = Q.el("button", "btn primary", editingTask ? "Guardar" : "Añadir tarea");
    submit.type = "submit";
    actions.appendChild(submit);
    if (editingTask) {
      actions.appendChild(Q.btn("btn ghost", "Cancelar", function () {
        editingTask = null; Q.refresh();
      }));
    }
    f.appendChild(actions);

    Q.on(f, "submit", function (ev) {
      ev.preventDefault();
      var v = title.value.trim();
      if (!v) return;
      var fields = {
        title: v, note: note.value.trim(), due: due.value || null,
        goalId: goal.value || null, subjectId: subj.value || null,
        status: status.value, urgent: urgent.checked, important: important.checked
      };
      if (editingTask) {
        Object.assign(editingTask, fields);
        editingTask.done = fields.status === "done";
        editingTask.doneAt = editingTask.done ? (editingTask.doneAt || Q.key(Q.today())) : null;
        editingTask = null;
      } else {
        var nt = addTask(fields);
        nt.done = fields.status === "done";
        if (nt.done) nt.doneAt = Q.key(Q.today());
      }
      Q.save(); Q.refresh();
      Q.toast("Tarea guardada.");
    });

    host.appendChild(f);
  }

  /* ── editor de hábitos ────────────────────────────────────────────────── */
  var editingHabit = null;
  var habitDays = [1, 2, 3, 4, 5];
  var habitColor = Q.HUES[0];

  function habitForm(host) {
    Q.clear(host);
    var h = editingHabit || {};
    var f = Q.el("form", "stack");

    var name = Q.input("text", { maxlength: 60, placeholder: "Caminar 20 minutos", required: "required" });
    name.value = h.name || "";
    f.appendChild(Q.field("Hábito", name));

    var note = Q.input("text", { maxlength: 120, placeholder: "para despejar la cabeza" });
    note.value = h.note || "";
    f.appendChild(Q.field("Intención", note));

    var cadWrap = Q.el("div", "stack-tight");
    var cadRow = Q.el("div", "checkrow");
    var chosen = h.cadence || "daily";
    ["daily", "weekdays", "custom"].forEach(function (v, i) {
      var lbl = Q.el("label");
      var r = Q.input("radio", { name: "cad-" + (h.id || "new") });
      r.value = v;
      r.checked = chosen === v;
      Q.on(r, "change", function () { picker.hidden = v !== "custom"; });
      lbl.appendChild(r);
      lbl.appendChild(document.createTextNode(
        " " + ["Todos los días", "Entre semana", "Días sueltos"][i]));
      cadRow.appendChild(lbl);
    });
    cadWrap.appendChild(cadRow);
    var picker = Q.el("div", "daypicker");
    picker.hidden = chosen !== "custom";
    habitDays = (h.days && h.days.length) ? h.days.slice() : [1, 2, 3, 4, 5];
    function drawPicker() {
      Q.clear(picker);
      Q.DAY_SHORT.forEach(function (s, i) {
        var on = habitDays.indexOf(i) !== -1;
        var b = Q.btn(on ? "is-on" : "", s, function () {
          var at = habitDays.indexOf(i);
          if (at === -1) habitDays.push(i); else habitDays.splice(at, 1);
          drawPicker();
        });
        b.setAttribute("aria-pressed", String(on));
        picker.appendChild(b);
      });
    }
    drawPicker();
    cadWrap.appendChild(picker);
    f.appendChild(Q.field("Días", cadWrap));

    var grid = Q.el("div", "grid-2");
    var goal = Q.select(goalOptions(), h.goalId || "");
    grid.appendChild(Q.field("Meta", goal));
    var swatches = Q.el("div", "swatches");
    habitColor = h.color || Q.HUES[Q.db.habits.length % Q.HUES.length];
    function drawSwatches() {
      Q.clear(swatches);
      Q.HUES.forEach(function (c) {
        var b = Q.btn("swatch" + (c === habitColor ? " is-on" : ""), null, function () {
          habitColor = c; drawSwatches();
        });
        b.style.background = c;
        b.setAttribute("aria-label", "Color " + c);
        swatches.appendChild(b);
      });
    }
    drawSwatches();
    grid.appendChild(Q.field("Color", swatches));
    f.appendChild(grid);

    var actions = Q.el("div", "form-actions");
    var submit = Q.el("button", "btn primary", editingHabit ? "Guardar" : "Añadir hábito");
    submit.type = "submit";
    actions.appendChild(submit);
    if (editingHabit) {
      actions.appendChild(Q.btn("btn ghost", "Cancelar", function () {
        editingHabit = null; Q.refresh();
      }));
    }
    f.appendChild(actions);

    Q.on(f, "submit", function (ev) {
      ev.preventDefault();
      var v = name.value.trim();
      if (!v) return;
      var cad = f.querySelector('input[type=radio]:checked').value;
      if (cad === "custom" && !habitDays.length) {
        Q.toast("Elige al menos un día.", true);
        return;
      }
      var data = {
        name: v, note: note.value.trim(), cadence: cad,
        days: cad === "custom" ? habitDays.slice().sort() : [],
        color: habitColor, goalId: goal.value || null
      };
      if (editingHabit) Object.assign(editingHabit, data);
      else {
        data.id = Q.uid("h");
        data.archived = false;
        data.createdAt = Q.key(Q.today());
        Q.db.habits.push(data);
      }
      editingHabit = null;
      Q.save(); Q.refresh();
      Q.toast("Hábito guardado.");
    });

    host.appendChild(f);
  }

  /* ── vista: HOY ───────────────────────────────────────────────────────── */
  var cursor = Q.today();

  function renderToday() {
    var v = Q.$("#view-today");
    Q.clear(v);
    var k = Q.key(cursor);

    // Primera visita: portada en vez de nueve pestañas vacías.
    if (QP.demo && QP.demo.shouldWelcome()) {
      v.appendChild(QP.demo.welcome());
      return;
    }
    var bar0 = QP.demo && QP.demo.banner();
    if (bar0) v.appendChild(bar0);

    var bar = Q.el("div", "daybar");
    bar.appendChild(Q.btn("step", "←", function () {
      cursor = Q.addDays(cursor, -1); renderToday();
    }));
    var lab = Q.el("div", "daybar-label");
    lab.appendChild(Q.el("h2", null, Q.relativeDay(cursor)));
    lab.appendChild(Q.el("p", "muted small", Q.longDate(cursor)));
    bar.appendChild(lab);
    var next = Q.btn("step", "→", function () {
      if (cursor >= Q.today()) return;
      cursor = Q.addDays(cursor, 1); renderToday();
    });
    next.disabled = cursor >= Q.today();
    bar.appendChild(next);
    v.appendChild(bar);

    // Añadir rápido: una tarea para el día que se está viendo.
    var quick = Q.el("form", "quickadd");
    var qi = Q.input("text", { placeholder: "Añadir algo para este día…", maxlength: 120 });
    quick.appendChild(qi);
    var qb = Q.el("button", "btn primary", "Añadir");
    qb.type = "submit";
    quick.appendChild(qb);
    Q.on(quick, "submit", function (ev) {
      ev.preventDefault();
      var t = qi.value.trim();
      if (!t) return;
      addTask({ title: t, due: k });
      qi.value = "";
      renderToday();
    });
    v.appendChild(quick);

    // Una sola lista: primero las prácticas, luego lo puntual.
    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, "Tu día"));
    var habits = habitsDueOn(cursor);
    var tasks = tasksDueOn(cursor);
    var doneN = habits.filter(function (h) { return habitDone(h, cursor); }).length +
      tasks.filter(function (t) { return t.done; }).length;
    var totalN = habits.length + tasks.length;
    head.appendChild(Q.el("span", "count", totalN ? doneN + " de " + totalN : ""));
    card.appendChild(head);

    if (!totalN) {
      card.appendChild(Q.el("p", "empty",
        Q.db.habits.length || Q.db.tasks.length
          ? "Nada pendiente para este día. Descansar también es parte."
          : "Aún no hay nada. Escribe algo arriba, o crea un hábito en la pestaña Hábitos."));
    } else {
      var ul = Q.el("ul", "rows");
      habits.forEach(function (h) { ul.appendChild(habitRow(h, cursor)); });
      tasks.sort(function (a, b) { return (a.done - b.done) || (a.order - b.order); })
        .forEach(function (t) { ul.appendChild(taskRow(t, { actions: false })); });
      card.appendChild(ul);
    }
    v.appendChild(card);

    // Ánimo y nota del día.
    var mood = Q.el("section", "card");
    var mh = Q.el("div", "card-head");
    mh.appendChild(Q.el("h3", null, "¿Cómo estuvo el día?"));
    mood.appendChild(mh);
    var e = entry(k, false);
    var row = Q.el("div", "moods");
    ["duro", "flojo", "normal", "bien", "pleno"].forEach(function (label, i) {
      var val = i + 1;
      var b = Q.btn("mood" + (e && e.mood === val ? " is-on" : ""), null, function () {
        var en = entry(k, true);
        en.mood = en.mood === val ? null : val;
        pruneEntry(k); Q.save(); renderToday();
      });
      b.setAttribute("aria-pressed", String(!!(e && e.mood === val)));
      var face = Q.el("span", "face");
      var fill = Q.el("i");
      fill.style.height = (val * 20) + "%";
      face.appendChild(fill);
      b.appendChild(face);
      b.appendChild(Q.el("span", "label", label));
      row.appendChild(b);
    });
    mood.appendChild(row);

    var ta = Q.input("textarea", { rows: 4, placeholder: "Lo que pasó, lo que costó, lo que agradeces…" });
    ta.value = (e && e.note) || "";
    var hint = Q.el("p", "saved");
    var timer = null;
    Q.on(ta, "input", function () {
      clearTimeout(timer);
      var val = ta.value;
      timer = setTimeout(function () {
        var en = entry(k, true);
        en.note = val;
        pruneEntry(k);
        Q.save();
        hint.textContent = "guardado";
        setTimeout(function () { hint.textContent = ""; }, 1400);
      }, 500);
    });
    mood.appendChild(Q.field("Una nota, si quieres", ta));
    mood.appendChild(hint);
    v.appendChild(mood);
  }

  /* ── vista: TAREAS (lista + Eisenhower + tablero) ─────────────────────── */
  var taskMode = "list";

  function renderTasks() {
    var v = Q.$("#view-tasks");
    Q.clear(v);

    var form = Q.el("section", "card");
    var fh = Q.el("div", "card-head");
    fh.appendChild(Q.el("h3", null, editingTask ? "Editar tarea" : "Nueva tarea"));
    form.appendChild(fh);
    var host = Q.el("div");
    host.id = "taskFormHost";
    form.appendChild(host);
    taskForm(host);
    v.appendChild(form);

    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, "Tareas"));
    var modes = Q.el("div", "segmented");
    [["list", "Lista"], ["matrix", "Eisenhower"], ["board", "Tablero"]].forEach(function (m) {
      var b = Q.btn(taskMode === m[0] ? "is-on" : "", m[1], function () {
        taskMode = m[0]; renderTasks();
      });
      b.setAttribute("aria-pressed", String(taskMode === m[0]));
      modes.appendChild(b);
    });
    head.appendChild(modes);
    card.appendChild(head);

    if (!Q.db.tasks.length) {
      card.appendChild(Q.el("p", "empty", "Sin tareas. Añade la primera arriba."));
    } else if (taskMode === "list") renderList(card);
    else if (taskMode === "matrix") renderMatrix(card);
    else renderBoard(card);

    v.appendChild(card);
  }

  function renderList(card) {
    var open = Q.db.tasks.filter(function (t) { return !t.done; });
    var done = Q.db.tasks.filter(function (t) { return t.done; });
    open.sort(function (a, b) {
      var ad = a.due || "9999", bd = b.due || "9999";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (b.urgent + b.important) - (a.urgent + a.important);
    });
    var ul = Q.el("ul", "rows");
    open.forEach(function (t) { ul.appendChild(taskRow(t)); });
    card.appendChild(ul);
    if (done.length) {
      var det = Q.el("details", "done-fold");
      det.appendChild(Q.el("summary", null, done.length + (done.length === 1 ? " hecha" : " hechas")));
      var dl = Q.el("ul", "rows");
      done.sort(function (a, b) { return (b.doneAt || "") < (a.doneAt || "") ? -1 : 1; })
        .forEach(function (t) { dl.appendChild(taskRow(t)); });
      det.appendChild(dl);
      card.appendChild(det);
    }
  }

  function renderMatrix(card) {
    var open = Q.db.tasks.filter(function (t) { return !t.done; });
    var quads = [
      { key: "do", title: "Hazlo ya", sub: "urgente e importante", f: function (t) { return t.urgent && t.important; } },
      { key: "plan", title: "Planifícalo", sub: "importante, no urgente", f: function (t) { return !t.urgent && t.important; } },
      { key: "deleg", title: "Delégalo o acórtalo", sub: "urgente, no importante", f: function (t) { return t.urgent && !t.important; } },
      { key: "drop", title: "Déjalo caer", sub: "ni urgente ni importante", f: function (t) { return !t.urgent && !t.important; } }
    ];
    var wrap = Q.el("div", "matrix");
    quads.forEach(function (q) {
      var cell = Q.el("div", "quad quad-" + q.key);
      var h = Q.el("div", "quad-head");
      h.appendChild(Q.el("strong", null, q.title));
      h.appendChild(Q.el("span", null, q.sub));
      cell.appendChild(h);
      var items = open.filter(q.f);
      if (!items.length) cell.appendChild(Q.el("p", "empty", "—"));
      else {
        var ul = Q.el("ul", "rows tight");
        items.forEach(function (t) { ul.appendChild(taskRow(t, { actions: false })); });
        cell.appendChild(ul);
      }
      wrap.appendChild(cell);
    });
    card.appendChild(wrap);
    card.appendChild(Q.el("p", "muted small",
      "Marca «urgente» e «importante» al editar una tarea para colocarla en su cuadrante."));
  }

  function renderBoard(card) {
    var cols = [
      { key: "todo", title: "Por hacer" },
      { key: "doing", title: "En marcha" },
      { key: "done", title: "Hecho" }
    ];
    var wrap = Q.el("div", "board");
    cols.forEach(function (c) {
      var col = Q.el("div", "col");
      col.dataset.status = c.key;
      var h = Q.el("div", "col-head");
      h.appendChild(Q.el("strong", null, c.title));
      var items = Q.db.tasks.filter(function (t) {
        return (t.status || (t.done ? "done" : "todo")) === c.key;
      });
      h.appendChild(Q.el("span", "count", String(items.length)));
      col.appendChild(h);

      var list = Q.el("div", "col-list");
      items.forEach(function (t) {
        var cardEl = Q.el("article", "tcard" + (t.done ? " is-done" : ""));
        cardEl.draggable = true;
        cardEl.dataset.id = t.id;
        cardEl.appendChild(Q.el("p", "tcard-title", t.title));
        var m = Q.el("div", "tcard-meta");
        var due = Q.dueLabel(t.due);
        if (due) m.appendChild(Q.el("span", "chip" + (due.late ? " is-late" : due.soon ? " is-soon" : ""), due.text));
        var g = t.goalId && Q.byId(Q.db.goals, t.goalId);
        if (g) m.appendChild(Q.el("span", "chip is-link", "◎ " + g.title));
        if (m.childNodes.length) cardEl.appendChild(m);
        var mv = Q.el("div", "tcard-move");
        cols.forEach(function (other) {
          if (other.key === c.key) return;
          mv.appendChild(Q.btn(null, "→ " + other.title, function () {
            moveTask(t.id, other.key);
          }));
        });
        cardEl.appendChild(mv);
        Q.on(cardEl, "dragstart", function (ev) {
          ev.dataTransfer.setData("text/plain", t.id);
          ev.dataTransfer.effectAllowed = "move";
          cardEl.classList.add("dragging");
        });
        Q.on(cardEl, "dragend", function () { cardEl.classList.remove("dragging"); });
        list.appendChild(cardEl);
      });
      if (!items.length) list.appendChild(Q.el("p", "empty", "—"));
      col.appendChild(list);

      Q.on(col, "dragover", function (ev) { ev.preventDefault(); col.classList.add("over"); });
      Q.on(col, "dragleave", function () { col.classList.remove("over"); });
      Q.on(col, "drop", function (ev) {
        ev.preventDefault();
        col.classList.remove("over");
        var id = ev.dataTransfer.getData("text/plain");
        if (id) moveTask(id, c.key);
      });
      wrap.appendChild(col);
    });
    card.appendChild(wrap);
    card.appendChild(Q.el("p", "muted small",
      "Arrastra las tarjetas entre columnas, o usa los botones de cada tarjeta."));
  }

  function moveTask(id, status) {
    var t = Q.byId(Q.db.tasks, id);
    if (!t) return;
    t.status = status;
    t.done = status === "done";
    t.doneAt = t.done ? (t.doneAt || Q.key(Q.today())) : null;
    Q.save();
    renderTasks();
  }

  /* ── vista: HÁBITOS ───────────────────────────────────────────────────── */
  var showArchived = false;

  function renderHabits() {
    var v = Q.$("#view-habits");
    Q.clear(v);

    var form = Q.el("section", "card");
    var fh = Q.el("div", "card-head");
    fh.appendChild(Q.el("h3", null, editingHabit ? "Editar hábito" : "Nuevo hábito"));
    form.appendChild(fh);
    var host = Q.el("div");
    form.appendChild(host);
    habitForm(host);
    v.appendChild(form);

    var card = Q.el("section", "card");
    var head = Q.el("div", "card-head");
    head.appendChild(Q.el("h3", null, "Tus hábitos"));
    var lbl = Q.el("label", "toggle");
    var cb = Q.input("checkbox", {});
    cb.checked = showArchived;
    Q.on(cb, "change", function () { showArchived = cb.checked; renderHabits(); });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(" ver archivados"));
    head.appendChild(lbl);
    card.appendChild(head);

    var rows = Q.db.habits.filter(function (h) { return showArchived || !h.archived; });
    if (!rows.length) {
      card.appendChild(Q.el("p", "empty", "Nada aquí todavía. Empieza con uno solo — de verdad, uno."));
    } else {
      var ul = Q.el("ul", "rows");
      rows.forEach(function (h) {
        var li = Q.el("li", "row" + (h.archived ? " is-archived" : ""));
